name: fizya_clash
description: "فيزيا كلاش — Clash of Physics · منهاج الثالث الثانوي العلمي · loraneem-tech"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# قرار ٥١: الحزم تُضاف تدريجياً مع مهام الاستخدام (M3/M4) — أماناً لأول بناء.
# هذا الملف مقصود أن يكون الحد الأدنى الذي يضمن نجاح أول APK على جهاز صاحب المشروع.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # نطق الفقرات «اسمعني» — يُخفى الزر عند غياب المحرك العربي (قرار F3.2)
  flutter_tts: ^4.0.0
  # تقدم القراءة المحفوظ (F3.1 — قرار ٥٧: KV يكفي؛ Drift لدفتر XP في F7)
  shared_preferences: ^2.2.0
  # فحص التوقيع المحلي للترخيص Ed25519 (F3.6 — docs/11 §٥: RFC 8032)
  ed25519_edwards: ^0.3.2
  # توقيع أحداث دفتر XP (F3.7 — docs/12 §٤.۲)
  crypto: ^3.0.0
  # خزنة بذرة مفتاح الجهاز (F3.7 — الترقية لـKeystore مع F4.4)
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
  # خطا Cairo وTajawal يُعلَنان هنا في F0.3 بعد وضع ملفاتهما (app/BUILD.md §الخطوط)
