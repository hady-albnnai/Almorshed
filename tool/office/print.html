<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة أكواد التفعيل — فيزيا كلاش</title>
<style>
  :root { --ink:#0f172a; --line:#cbd5e1; --brand:#0f766e; }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink); margin: 0; padding: 24px; background:#f8fafc;
  }
  .no-print { max-width: 760px; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--brand); }
  p.sub { margin: 0 0 12px; color:#475569; font-size: 14px; }
  textarea {
    width: 100%; min-height: 120px; padding: 10px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 8px; font-family: monospace;
    direction: ltr; text-align: left; background:#fff;
  }
  label { display:block; font-size: 14px; margin: 12px 0 4px; font-weight:600; }
  button {
    margin-top: 12px; padding: 10px 22px; font-size: 15px; cursor: pointer;
    background: var(--brand); color:#fff; border:0; border-radius:8px;
  }
  .grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 22px; }
  .card {
    border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px;
    background:#fff; page-break-inside: avoid;
  }
  .card .brand { font-size: 12px; color: var(--brand); font-weight: 700; }
  .card .code {
    font-family: monospace; font-size: 24px; font-weight: 800;
    letter-spacing: 2px; direction: ltr; text-align: center; margin: 8px 0 4px;
  }
  .card .meta { font-size: 11px; color:#64748b; text-align: center; }
  @media print {
    .no-print { display:none; }
    body { padding: 0; background:#fff; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="no-print">
  <h1>فيزيا كلاش — طباعة أكواد التفعيل</h1>
  <p class="sub">الصق الأكواد (سطر لكل كود، أو مفصولة بفواصل/فراغات) ثم «اعرض للطباعة».</p>
  <textarea id="codes" placeholder="K7M2P-9QW4X-ABCDE&#10;QW4XA-BCDEK-7M2P9"></textarea>
  <label>اسم الموزّع (العلامة المائية — قرار ٣٢):</label>
  <input id="dist" type="text" value="مكتب لورانيم" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;">
  <br><button onclick="render()">اعرض للطباعة 🖨</button>
</div>
<div id="out" class="grid"></div>
<script>
  function normalize(raw) {
    return (raw || '')
      .toUpperCase()
      .replace(/[^A-Z0-9\-]/g, ' ')
      .split(/\s+/)
      .filter(function (s) { return s.length > 0; });
  }
  function render() {
    var codes = normalize(document.getElementById('codes').value);
    var dist = document.getElementById('dist').value || 'مكتب لورانيم';
    var out = document.getElementById('out');
    out.innerHTML = '';
    codes.forEach(function (c) {
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="brand">فيزيا كلاش · ' + dist + '</div>' +
        '<div class="code">' + c + '</div>' +
        '<div class="meta">صلاحية ٣٠ يوماً من أول تفعيل · جهازان كحد أقصى · حتى موعد الامتحان</div>';
      out.appendChild(el);
    });
    if (codes.length) setTimeout(function () { window.print(); }, 250);
  }
</script>
</body>
</html>
