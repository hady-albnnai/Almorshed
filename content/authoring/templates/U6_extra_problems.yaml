  # ── ٥٨) الأمواج المستقرة على وتر (U3C1) — كتلة الوتر · السرعة · الأساسي ──
  - id: U3.L1.P04
    title: "الوتر المشدود — مسألة بأجزاء (الكتلة الطولية من الكتلة · سرعة الموجة · الأساسي)"
    chapter: U3C1
    type: problem
    difficulty: 3
    source:
      lesson: "L1 — μ = m/L · v = √(F/μ) · f1 = v/(2L)"
      book: "الكتلة الطولية من كتلة الوتر وطوله"
      exam: "بنية ٣ أجزاء — سلمها ٥/٣/١/١ لكل سطر (docs/20 §٢)"
    vars:
      mgr: {set: [1, 2, 4, 5, 10], unit: g}
      L: {set: [0.5, 1.0, 2.0], unit: m}
      F: {set: [10, 40, 90, 160, 250], unit: N}
    compute:
      mu: "mgr*1e-3/L"
      v: "sqrt(F/(mgr*1e-3/L))"
      f1: "sqrt(F/(mgr*1e-3/L))/(2*L)"
    stem: "وتر مشدود من طرفيه طوله L = {L} m وكتلته m = {mgr} g، مشدود بقوة توتر F = {F} N."
    parts:
      - label: "١"
        ask: "احسب الكتلة الطولية μ للوتر."
        unit: "kg·m⁻¹"
        value: "mu"
        answer: {format: sci, round: true, sig: 3}
        lines:
          - relation: "الكتلة الطولية: μ = m/L"
            subst: "μ = {mgr}×10⁻³/{L}"
            expect: ["{mgr}", "{L}"]
            keys: ["μ = m/L"]
            anti_keys: ["μ = L/m", "μ = m·L"]
      - label: "٢"
        ask: "احسب سرعة انتشار الموجة v على الوتر."
        unit: "m·s⁻¹"
        value: "v"
        answer: {format: auto}
        follow: {depends_on: "١", power: -0.5}   # v = √(F/μ) ⇒ ∝ μ^(−1/2)
        lines:
          - relation: "سرعة الموجة على وتر: v = √(F/μ)"
            subst: "v = √({F}/{mu})"
            expect: ["{F}"]
            keys: ["v = √(F/μ)"]
            anti_keys: ["v = √(μ/F)", "v = F/μ"]
      - label: "٣"
        ask: "احسب التواتر الأساسي f1 للوتر."
        unit: "Hz"
        value: "f1"
        answer: {format: auto}
        follow: {depends_on: "٢", power: 1}   # f1 = v/(2L) ⇒ ∝ v
        lines:
          - relation: "التواتر الأساسي: f1 = v/(2L)"
            subst: "f1 = {v}/(2·{L})"
            expect: ["{L}"]
            keys: ["f1 = v/(2L)"]
            anti_keys: ["f1 = 2L·v", "f1 = v/L"]
    answer_basis: "الوتر: μ = m/L · v = √(F/μ) · f1 = v/(2L). سلم ٥/٣/١/١."
    review_notes:
      - "الجزء ٢ متابعة بقوّة −0.5 على μ، والجزء ٣ متابعة بقوّة 1 على v."
    approved: false
