    title: "الأثر الكهرضوئي — مسألة بأجزاء (طاقة الفوتون · عدد الفوتونات · التيار المشبع)"
    chapter: U4C3
    type: problem
    difficulty: 3
    source:
      lesson: "L3 — طاقة الفوتون E = h·c/λ · عدد الفوتونات/ثانية N = P/E · التيار I = N·e"
      book: "افتراض مردود كمومي = 1"
      exam: "بنية ٣ أجزاء — سلمها ٥/٣/١/١ لكل سطر (docs/20 §٢)"
