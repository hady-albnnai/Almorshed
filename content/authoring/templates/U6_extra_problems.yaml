    compute:
      F: "6.67e-11*m1*m2/d**2"
      a2: "6.67e-11*m1/d**2"
      a1: "6.67e-11*m2/d**2"
    stem: "كتلتان نقطيّتان m1 = {m1} kg و m2 = {m2} kg يفصل بين مركزيهما مسافة d = {d} m. نأخذ ثابت الجذب العام G = 6.67×10⁻¹¹ SI."
    parts:
      - label: "١"
        ask: "احسب شدّة قوة التجاذب F بين الكتلتين."
        unit: "N"
        value: "F"
        answer: {format: sci, round: true, sig: 3}
