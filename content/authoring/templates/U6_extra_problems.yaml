  # ── ٥٧) الجذب العام (U5C1) — قوة التجاذب بين كتلتين والتسارعات ──
  - id: U5.L1.P03
    title: "الجذب العام — مسألة بأجزاء (قوة التجاذب · تسارع كل كتلة)"
    chapter: U5C1
    type: problem
    difficulty: 3
    source:
      lesson: "L1 — قانون نيوتن للجذب العام: F = G·m1·m2/d² · a = F/m"
