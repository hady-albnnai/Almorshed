      lam: {set: [200, 300, 400, 500, 620], unit: nm}
      Pmw: {set: [1, 2, 5, 10, 20, 50, 100], unit: mW}
    constants_used: {h_planck: 6.63e-34, c_light: 3e8, e_charge: 1.6e-19}
    compute:
      Eph: "6.63e-34*3e8/(lam*1e-9)"
      Nrate: "(Pmw*1e-3)/(6.63e-34*3e8/(lam*1e-9))"
      I: "((Pmw*1e-3)/(6.63e-34*3e8/(lam*1e-9)))*1.6e-19"
    stem: "يسقط ضوء أحادي اللون طول موجته λ = {lam} nm واستطاعته P = {Pmw} mW على مهبط كهرضوئي. نأخذ h = 6.63×10⁻³⁴ J·s و c = 3×10⁸ m·s⁻¹ و e = 1.6×10⁻¹⁹ C، ونفترض أنّ كل فوتون يقتلع إلكتروناً."
    parts:
      - label: "١"
        ask: "احسب طاقة الفوتون الساقط E (بالجول)."
        unit: "J"
        value: "Eph"
        answer: {format: sci, round: true, sig: 3}
        lines:
          - relation: "طاقة الفوتون: E = h·c/λ"
            subst: "E = 6.63×10⁻³⁴·3×10⁸/({lam}×10⁻⁹)"
            expect: ["{lam}"]
            keys: ["E = h·c/λ"]
            anti_keys: ["E = h·λ/c", "E = λ/(h·c)"]
      - label: "٢"
        ask: "احسب عدد الفوتونات N الساقطة في الثانية."
        unit: "s⁻¹"
        value: "Nrate"
        answer: {format: sci, round: true, sig: 3}
        follow: {depends_on: "١", power: -1}   # N = P/E ⇒ ∝ 1/E
        lines:
          - relation: "عدد الفوتونات في الثانية: N = P/E"
            subst: "N = {Pmw}×10⁻³/{Eph}"
            expect: ["{Pmw}"]
            keys: ["N = P/E"]
            anti_keys: ["N = P·E", "N = E/P"]
      - label: "٣"
        ask: "احسب التيار الكهرضوئي المشبع I (بفرض قلع إلكترون واحد لكل فوتون)."
        unit: "A"
        value: "I"
        answer: {format: sci, round: true, sig: 3}
        follow: {depends_on: "٢", power: 1}   # I = N·e ⇒ ∝ N
        lines:
          - relation: "التيار المشبع: I = N·e"
            subst: "I = {Nrate}·1.6×10⁻¹⁹"
            expect: ["{Nrate}"]
            keys: ["I = N·e"]
            anti_keys: ["I = N/e", "I = e/N"]
