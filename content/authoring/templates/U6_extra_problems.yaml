          - relation: "قانون الجذب العام: F = G·m1·m2/d²"
            subst: "F = 6.67×10⁻¹¹·{m1}·{m2}/{d}²"
            expect: ["{m1}", "{m2}", "{d}"]
            keys: ["F = G·m1·m2/d²"]
            anti_keys: ["F = G·m1·m2/d", "F = G·m1·m2·d²"]
      - label: "٢"
        ask: "احسب تسارع الكتلة m2 الناتج عن هذه القوة."
        unit: "m·s⁻²"
        value: "a2"
        answer: {format: sci, round: true, sig: 3}
        follow: {depends_on: "١", power: 1}   # a2 = F/m2 ⇒ ∝ F
        lines:
          - relation: "من العلاقة الأساسية: a2 = F/m2 = G·m1/d²"
            subst: "a2 = {F}/{m2}"
            expect: ["{m2}"]
            keys: ["a2 = F/m2", "a2 = G·m1/d²"]
            anti_keys: ["a2 = F·m2", "a2 = G·m2/d²"]
      - label: "٣"
        ask: "احسب تسارع الكتلة m1 الناتج عن القوة نفسها."
        unit: "m·s⁻²"
        value: "a1"
        answer: {format: sci, round: true, sig: 3}
        follow: {depends_on: "١", power: 1}   # a1 = F/m1 ⇒ ∝ F
        lines:
          - relation: "a1 = F/m1 = G·m2/d²"
            subst: "a1 = {F}/{m1}"
            expect: ["{m1}"]
            keys: ["a1 = F/m1", "a1 = G·m2/d²"]
            anti_keys: ["a1 = F·m1", "a1 = G·m1/d²"]
    answer_basis: "الجذب العام: F = G·m1·m2/d² · a2 = F/m2 · a1 = F/m1. سلم ٥/٣/١/١."
