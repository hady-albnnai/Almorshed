        follow: {depends_on: "١", power: 2}   # F = μ·v² ⇒ ∝ v²
        lines:
          - relation: "سرعة الموجة على وتر: v = √(F/μ) ⇒ F = μ·v²"
            subst: "F = {mug}×10⁻³·{v}²"
            expect: ["{mug}"]
            keys: ["F = μ·v²"]
            anti_keys: ["F = μ·v", "F = v²/μ"]
      - label: "٣"
        ask: "احسب تواتر المدروج الثالث f3."
        unit: "Hz"
        value: "f3"
        answer: {format: auto}
        lines:
          - relation: "التوافقيات: fn = n·f1 ⇒ f3 = 3·f1"
            subst: "f3 = 3·{f1}"
            expect: ["{f1}"]
            keys: ["f3 = 3·f1"]
            anti_keys: ["f3 = f1/3", "f3 = 3·f1²"]
    answer_basis: "الوتر: v = 2·L·f1 · F = μ·v² · f3 = 3·f1. سلم ٥/٣/١/١."
    review_notes:
      - "الجزء ٢ متابعة على السرعة v بقوّة 2 (F ∝ v²)."
