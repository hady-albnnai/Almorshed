    compute:
      v: "2*L*f1"
      F: "mug*1e-3*(2*L*f1)**2"
      f3: "3*f1"
    stem: "وتر مثبّت من طرفيه طوله L = {L} m وكتلته الطولية μ = {mug} g·m⁻¹ يهتز على أساسيّه (المدروج الأول) بتواتر f1 = {f1} Hz."
    parts:
      - label: "١"
        ask: "احسب سرعة انتشار الموجة v على الوتر."
        unit: "m·s⁻¹"
        value: "v"
        answer: {format: auto}
        lines:
          - relation: "على الأساسي: λ1 = 2L ⇒ v = λ1·f1 = 2·L·f1"
            subst: "v = 2·{L}·{f1}"
            expect: ["{L}", "{f1}"]
            keys: ["v = 2·L·f1"]
            anti_keys: ["v = L·f1", "v = f1/(2L)"]
      - label: "٢"
