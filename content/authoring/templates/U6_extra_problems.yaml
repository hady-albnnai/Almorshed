            expect: ["{I}", "{d}"]
            keys: ["B = μ0·I/(2πd)", "2×10⁻⁷·I/d"]
            anti_keys: ["B = μ0·I·d/(2π)", "B = 2×10⁻⁷·d/I"]
      - label: "٢"
        ask: "احسب شدّة الحقل إذا ضوعف البعد عن الناقل (2d)."
        unit: "T"
        value: "Bhalf"
        answer: {format: sci, round: true, sig: 3}
        follow: {depends_on: "١", power: 1}
        lines:
          - relation: "بما أن B ∝ 1/d فإن مضاعفة البعد تنصّف الحقل: B' = ½·B"
            subst: "B' = 2×10⁻⁷·{I}/(2·{d})"
            expect: ["{I}", "{d}"]
            keys: ["B ∝ 1/d", "B' = ½·B"]
            anti_keys: ["B' = 2·B", "B' = B"]
      - label: "٣"
        ask: "احسب قوة لورنتز F المؤثّرة في إلكترون يتحرّك بسرعة v = {v} m·s⁻¹ عمودياً على الحقل عند البعد d."
        unit: "N"
