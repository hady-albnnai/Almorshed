  - id: U3.L1.P03
    title: "الوتر المشدود — مسألة عكسية بأجزاء (سرعة الموجة · قوة التوتر · التوافقي الثالث)"
    chapter: U3C1
    type: problem
    difficulty: 3
    source:
      lesson: "L1 — الأمواج المستقرة: v = 2·L·f1 · F = μ·v² · fn = n·f1"
      book: "على وتر مثبّت الطرفين: f1 = v/(2L)"
