            subst: "F = 1.6×10⁻¹⁹·{v}·{B}"
            expect: ["{v}", "{B}"]
            keys: ["F = q·v·B", "e·v·B"]
            anti_keys: ["F = q·v/B", "F = q·B/v"]
    answer_basis: "الناقل المستقيم: B = μ0·I/(2πd) · مضاعفة d تنصّف B · F = q·v·B. سلم ٥/٣/١/١ لكل سطر."
