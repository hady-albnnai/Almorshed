meta:
  version: 1
  generated: 2026-09-21
  unit: U2
  lessons_covered: [L1-magnetism, L2-magnetic-force-laplace, L3-electromagnetic-induction, L4-oscillating-circuit, L5-alternating-current, L6-transformers]

schema:
  distractor_rules:
    cos_sin_flux:        "خلط cos α (التدفق) بـsin α (العزم) — الزاوية مع الناظم لا مع المستوي"
    forget_N:            "أهمل عدد اللفات N"
    forget_mu0:          "أهمل μ0 أو 2×10⁻⁷ (ثابت الحقل)"
    LC_inverted:         "√(L/C) بدل √(LC) (خلط مع النواس المرن)"
    forget_sqrt2:        "خلط القيمة العظمى بالمنتجة (√2)"
    XL_XC_swap:          "قلب ردّية الوشيعة Lω باتساعية المكثفة 1/Cω"
    power_in_LC:         "حسب استطاعة على وشيعة/مكثفة (P = 0 فيهما)"
    Z_algebraic:         "جمع الممانعات جبرياً بدل فيثاغورث"
    ratio_inverted_transformer: "قلب نسبة التحويل (Ns/Np ↔ Np/Ns) أو نسبة التيار"
    transformer_energy:  "ظنّ المحولة الرافعة ترفع الاستطاعة"
    lenz_direction:      "عكس جهة التيار المتحرض (لنز)"
    flux_vs_rate:        "خلط التدفق بمعدل تغيره (e تتبع dΦ/dt)"
    work_not_zero:       "ظنّ القوة المغناطيسية تبذل عملاً/تغيّر السرعة"
    r_T_dependence:      "ظنّ الدور T في الحقل المغناطيسي يتعلق بالسرعة"
    forget_2_torque:     "أهمل الـ٢ (ذراع/قوتين) في عزم المزدوجة"

constants:
  g: 10
  pi_sq: 10
  pi_approx: 3.14

templates:

# ───────────────────────────── L1 — المغناطيسية (U2C1) ─────────────────────────────

- id: U2.L1.T01
  title: "التدفق المغناطيسي عبر وشيعة N لفة بزاوية α"
  chapter: U2C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ٨٠–٨١", lesson: "L1 §٥ [أستاذ س٥–س٦]", exam: "خصم سلم ٢٠٢٦ «Δφ = NBS» −١"}
  vars:
    N: {set: [50, 100, 200, 500]}
    B_mT: {set: [2, 4, 5, 10, 20, 50]}
    S_cm2: {set: [10, 20, 25, 40, 50, 100]}
    alpha: {set: [0, 37, 60]}
  compute:
    cosA: "{0: 1.0, 37: 0.8, 60: 0.5}[alpha]"
    sinA: "{0: 0.0, 37: 0.6, 60: 0.866}[alpha]"
    key: "N * B_mT * 1e-3 * S_cm2 * 1e-4 * cosA"
    atxt: "'يوازي الناظم على مستويها' if alpha == 0 else f'يصنع زاوية {alpha}° مع الناظم على مستويها'"
  constraints:
    - "key > 0"
  stem: "وشيعة مسطحة من {N} لفة مساحة كل منها {S_cm2} cm² موضوعة في حقل مغناطيسي منتظم شدته {B_mT} mT {atxt}. احسب التدفق المغناطيسي عبر الوشيعة."
  answer: {unit: "Wb", format: sci}
  options:
    distractors:
      - {value: "B_mT * 1e-3 * S_cm2 * 1e-4 * cosA", rule: forget_N, rationale: "أهمل N"}
      - {value: "N * B_mT * 1e-3 * S_cm2 * 1e-4 * (sinA if alpha != 0 else 0.5)", rule: cos_sin_flux, rationale: "sin بدل cos (الزاوية مع المستوي)"}
      - {value: "N * B_mT * 1e-3 * S_cm2 * cosA", rule: unit_cm_m, rationale: "لم يحوّل cm² ⇒ m²"}
  rubric:
    - {step: "Φ = N·B·S·cos α", points: 5}
    - {step: "التحويلات والتعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة Wb", points: 1}
  answer_basis: "Φ = N·B·S·cos α — α بين B⃗ والناظم (الكتاب ص ٨٠)"
  approved: false

- id: U2.L1.T02
  title: "الحقل المغناطيسي لسلك مستقيم / وشيعة طويلة"
  chapter: U2C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ٧٤–٧٨", lesson: "L1 §٤ جدول عناصر الحقل [أستاذ طرق حل]"}
  vars:
    kind: {set: ["wire", "solenoid"]}
    I: {set: [2, 4, 5, 8, 10, 20]}
    d_cm: {set: [2, 4, 5, 10, 20]}
    n_per_cm: {set: [10, 20, 25, 50]}
  compute:
    key: "2e-7 * I / (d_cm * 1e-2) if kind == 'wire' else 4 * pi_approx * 1e-7 * n_per_cm * 100 * I"
    stem_txt: "f'سلك مستقيم طويل يمر فيه تيار شدته {I} A. احسب شدة الحقل المغناطيسي في نقطة تبعد {d_cm} cm عنه.' if kind == 'wire' else f'وشيعة طويلة تحوي {n_per_cm} لفة في كل سنتمتر من طولها يمر فيها تيار شدته {I} A. احسب شدة الحقل المغناطيسي داخلها (π = 3.14).'"
  stem: "{stem_txt}"
  answer: {unit: "T", format: sci}
  options:
    distractors:
      - {value: "2e-7 * I / d_cm if kind == 'wire' else 4 * pi_approx * 1e-7 * n_per_cm * I", rule: unit_cm_m, rationale: "لم يحوّل cm ⇒ m"}
      - {value: "I / (d_cm * 1e-2) * 1e-7 if kind == 'wire' else n_per_cm * 100 * I * 1e-7", rule: forget_mu0, rationale: "ثابت خاطئ (10⁻⁷ بدل 2×10⁻⁷ / أهمل 4π)"}
      - {value: "2e-7 * I * (d_cm * 1e-2) if kind == 'wire' else 4 * pi_approx * 1e-7 * I / (n_per_cm * 100)", rule: invert_ratio, rationale: "قلب النسبة"}
  rubric:
    - {step: "B = 2×10⁻⁷·I/d (سلك) أو B = μ0·n·I (وشيعة)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة T", points: 1}
  answer_basis: "الكتاب ص ٧٤ (سلك) و ص ٧٨ (وشيعة)"
  approved: false

- id: U2.L1.T03
  title: "مفاهيم المغناطيسية — النفوذية، التدفق، أورستد، الحقل الأرضي"
  chapter: U2C1
  type: mcq
  difficulty: 1
  weight: 10
  source: {book: "ص ٦٨–٨٧", lesson: "L1 §١–§٦", exam: "٢٠٢٦ س٢-١ النفوذية (٢٠)"}
  variants:
    - stem: "عامل النفوذية المغناطيسية μ لمادة هو:"
      key: "حاصل قسمة الحقل الكلي بوجود المادة على الحقل الأصلي في الخلاء"
      distractors:
        - {text: "حاصل ضرب الحقل الكلي بالحقل الأصلي", rule: mix_formulas}
        - {text: "الفرق بين الحقل الكلي والأصلي", rule: true_but_partial, rationale: "ذاك B′ حقل المغنطة"}
        - {text: "مقدار له وحدة التسلا", rule: unit_confusion, rationale: "μ بلا وحدة"}
    - stem: "يكون التدفق المغناطيسي عبر إطار مستوٍ معدوماً عندما:"
      key: "توازي خطوط الحقل مستوي الإطار (α = 90° مع الناظم)"
      distractors:
        - {text: "تكون خطوط الحقل عمودية على مستوي الإطار", rule: cos_sin_flux, rationale: "هنا التدفق أعظمي"}
        - {text: "تصنع الخطوط 45° مع الناظم", rule: mix_formulas}
        - {text: "يكون عدد اللفات صغيراً", rule: true_but_partial}
    - stem: "أثبتت تجربة أورستد أن:"
      key: "التيار الكهربائي يولّد حقلاً مغناطيسياً"
      distractors:
        - {text: "الشحنات الساكنة تولّد حقلاً مغناطيسياً", rule: mix_formulas}
        - {text: "الحقل المغناطيسي يولّد تياراً", rule: flux_vs_rate, rationale: "ذاك التحريض (فاراداي) ويلزم تغيّر"}
        - {text: "المغناطيس يجذب النحاس", rule: mix_formulas}
    - stem: "يتوقف عامل النفوذية المغناطيسية على:"
      key: "طبيعة المادة وشدة الحقل الممغنط"
      distractors:
        - {text: "طبيعة المادة فقط", rule: true_but_partial}
        - {text: "درجة الحرارة فقط", rule: mix_formulas}
        - {text: "حجم العينة", rule: mix_formulas}
    - stem: "وحدة التدفق المغناطيسي:"
      key: "الويبر Wb (= T·m²)"
      distractors:
        - {text: "التسلا T", rule: unit_confusion}
        - {text: "الأمبير A", rule: unit_confusion}
        - {text: "الهنري H", rule: unit_confusion}
  answer_basis: "الكتاب ص ٦٨–٨٧ [أستاذ س٢ س٥]"
  approved: false

# ───────────────────────────── L2 — لورنتز/لابلاس (U2C2) ─────────────────────────────

- id: U2.L2.T01
  title: "قوة لابلاس على ساق مستقيمة"
  chapter: U2C2
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ٩٣–٩٥", lesson: "L2 §٥ [أستاذ س٥] + السكتان", exam: "٢٠٢٦ س٣-٣ (٢٥)"}
  vars:
    I: {set: [2, 4, 5, 10]}
    L_cm: {set: [5, 10, 20, 25, 50]}
    B_T: {set: [0.1, 0.2, 0.4, 0.5]}
    theta: {set: [90, 37, 60]}
  compute:
    sinT: "{90: 1.0, 37: 0.6, 60: 0.866}[theta]"
    cosT: "{90: 0.0, 37: 0.8, 60: 0.5}[theta]"
    key: "I * L_cm * 1e-2 * B_T * sinT"
    atxt: "'عمودي على الساق' if theta == 90 else f'يصنع مع الساق زاوية {theta}°'"
  constraints:
    - "abs(key * 1000 - round(key * 1000)) < 1e-6"
  stem: "ساق ناقلة مستقيمة طولها {L_cm} cm يمر فيها تيار شدته {I} A موضوعة في حقل مغناطيسي منتظم شدته {B_T} T {atxt}. احسب شدة القوة الكهرطيسية المؤثرة فيها."
  answer: {unit: "N"}
  options:
    distractors:
      - {value: "I * L_cm * B_T * sinT", rule: unit_cm_m, rationale: "لم يحوّل cm ⇒ m"}
      - {value: "I * L_cm * 1e-2 * B_T * (cosT if theta != 90 else 0.5)", rule: sin_cos, rationale: "cos بدل sin"}
      - {value: "I * L_cm * 1e-2 * B_T * sinT * 2", rule: forget_2_torque, rationale: "ضاعف بلا مبرر (خلط بالمزدوجة)"}
  rubric:
    - {step: "F = I·L·B·sin θ", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة N", points: 1}
  answer_basis: "F = I·L·B·sin θ (الكتاب ص ٩٤)"
  approved: false

- id: U2.L2.T02
  title: "إلكترون في حقل منتظم — نصف القطر والدور"
  chapter: U2C2
  type: mcq
  difficulty: 2
  weight: 10
  source: {book: "ص ٩١–٩٢، MCQ ص ١٠١", lesson: "L2 البرهان المُرقَّم [أستاذ س٤]"}
  variants:
    - stem: "إلكترون يدخل بسرعة v⃗ عمودية على حقل مغناطيسي منتظم B⃗. إذا ضاعفنا شدة الحقل فإن نصف قطر مساره:"
      key: "ينصّف"
      distractors:
        - {text: "يتضاعف", rule: invert_ratio}
        - {text: "لا يتغير", rule: r_T_dependence}
        - {text: "يصير أربعة أمثال", rule: forget_sqrt}
    - stem: "دور حركة إلكترون في حقل مغناطيسي منتظم (v⃗ ⊥ B⃗):"
      key: "لا يتعلق بسرعة الإلكترون"
      distractors:
        - {text: "يتناسب طرداً مع السرعة", rule: r_T_dependence}
        - {text: "يتناسب عكساً مع السرعة", rule: r_T_dependence}
        - {text: "يتناسب طرداً مع شدة الحقل", rule: invert_ratio, rationale: "T = 2πme/(eB) عكساً"}
    - stem: "القوة المغناطيسية المؤثرة في شحنة متحركة في حقل مغناطيسي:"
      key: "لا تبذل عملاً لأنها عمودية على السرعة دائماً"
      distractors:
        - {text: "تزيد قيمة السرعة", rule: work_not_zero}
        - {text: "تنقص قيمة السرعة", rule: work_not_zero}
        - {text: "تبذل عملاً موجباً", rule: work_not_zero}
    - stem: "تكون القوة المغناطيسية على شحنة متحركة معدومة عندما:"
      key: "تتحرك الشحنة موازيةً لخطوط الحقل"
      distractors:
        - {text: "تتحرك عمودياً على الحقل", rule: sin_cos, rationale: "هنا القوة عظمى"}
        - {text: "تكون الشحنة سالبة", rule: mix_formulas}
        - {text: "تكون السرعة كبيرة", rule: mix_formulas}
    - stem: "نصف قطر مسار إلكترون في حقل مغناطيسي منتظم يُعطى بالعلاقة:"
      key: "r = me·v/(e·B)"
      distractors:
        - {text: "r = e·B/(me·v)", rule: invert_ratio}
        - {text: "r = me·v²/(e·B)", rule: forget_square, rationale: "v زائدة"}
        - {text: "r = 2π·me/(e·B)", rule: mix_formulas, rationale: "هذه علاقة الدور T"}
  answer_basis: "r = me·v/(eB) · T = 2πme/(eB) (الكتاب ص ٩١–٩٢)"
  approved: false

