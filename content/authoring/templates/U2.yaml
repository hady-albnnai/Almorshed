  stem: "وشيعة من {N} لفة تغيّر التدفق المغناطيسي عبر كل لفة منها بمقدار {dPhi_mWb} mWb خلال {dt_ms} ms. احسب القيمة المطلقة للقوة المحركة الكهربائية المتحرضة."
  answer: {unit: "V"}
  options:
    distractors:
      - {value: "dPhi_mWb * 1e-3 / (dt_ms * 1e-3)", rule: forget_N, rationale: "أهمل N"}
      - {value: "N * dPhi_mWb * 1e-3 * dt_ms * 1e-3", rule: invert_ratio, rationale: "ضرب بالزمن"}
      - {value: "N * dPhi_mWb * 1e-3", rule: flux_vs_rate, rationale: "أخذ التدفق نفسه لا معدل تغيره"}
