# ───────────────────────────── L4 — الدارة المهتزة (U2C4) ─────────────────────────────

- id: U2.L4.T01
  title: "علاقة طومسون — الدور الخاص لدارة LC"
  chapter: U2C4
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ١٣٠", lesson: "L4 البرهان ١ [أستاذ س٣]", exam: "٢٠٢٦ س٤ (٣٠)"}
  vars:
    L_mH: {set: [1, 2, 4, 10, 25, 40, 100]}
    C_uF: {set: [1, 4, 10, 25, 40, 100, 250]}
    ask: {set: ["T0", "f0"]}
  compute:
    LC: "L_mH * 1e-3 * C_uF * 1e-6"
    T0: "2 * pi_approx * sqrt(LC)"
    key: "T0 if ask == 'T0' else 1 / T0"
    qtxt: "'الدور الخاص T0' if ask == 'T0' else 'التواتر الخاص f0'"
    unit: "'s' if ask == 'T0' else 'Hz'"
  constraints:
    - "abs(sqrt(LC) * 1e5 - round(sqrt(LC) * 1e5)) < 1e-6"
  stem: "دارة مهتزة مؤلفة من وشيعة مهملة المقاومة ذاتيتها {L_mH} mH ومكثفة سعتها {C_uF} μF. احسب {qtxt} للاهتزازات الكهربائية الحرة غير المتخامدة (π = 3.14)."
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "2 * pi_approx * sqrt(L_mH * 1e-3 / (C_uF * 1e-6)) if ask == 'T0' else 1 / (2 * pi_approx * sqrt(L_mH * 1e-3 / (C_uF * 1e-6)))", rule: LC_inverted, rationale: "√(L/C) بدل √(LC)"}
      - {value: "sqrt(LC) if ask == 'T0' else 1 / sqrt(LC)", rule: forget_2pi, rationale: "أهمل 2π"}
      - {value: "1 / T0 if ask == 'T0' else T0", rule: invert_ratio, rationale: "قلب الدور بالتواتر"}
  rubric:
    - {step: "T0 = 2π√(LC)", points: 5}
    - {step: "التحويلات والتعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "T0 = 2π√(LC) علاقة طومسون (الكتاب ص ١٣٠)"
  approved: false

- id: U2.L4.T02
  title: "الطاقة الكلية في دارة LC والتيار الأعظمي"
  chapter: U2C4
  type: numeric
  difficulty: 3
  weight: 10
  source: {book: "ص ١٣٢–١٣٣", lesson: "L4 البرهان ٢ [أستاذ س٦]", exam: "٢٠٢٦ س٤ (٣٠)"}
  vars:
    C_uF: {set: [2, 4, 8, 10, 20, 50]}
    U: {set: [5, 10, 20, 50, 100]}
    L_mH: {set: [10, 20, 40, 50, 100, 200]}
    ask: {set: ["E", "Imax"]}
  compute:
    E: "0.5 * C_uF * 1e-6 * U**2"
    Imax: "sqrt(2 * E / (L_mH * 1e-3))"
    key: "E if ask == 'E' else Imax"
    qtxt: "'الطاقة الكلية للدارة' if ask == 'E' else 'الشدة العظمى للتيار'"
    unit: "'J' if ask == 'E' else 'A'"
  constraints:
    - "ask == 'E' or abs(Imax * 100 - round(Imax * 100)) < 1e-6"
  stem: "مكثفة سعتها {C_uF} μF شُحنت تحت توتر {U} V ثم وُصلت بوشيعة مهملة المقاومة ذاتيتها {L_mH} mH. احسب {qtxt}."
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "C_uF * 1e-6 * U**2 if ask == 'E' else sqrt(2 * C_uF * 1e-6 * U**2 / (L_mH * 1e-3))", rule: forget_half, rationale: "أهمل ½ في الطاقة"}
      - {value: "0.5 * C_uF * 1e-6 * U if ask == 'E' else 2 * E / (L_mH * 1e-3)", rule: forget_square, rationale: "أهمل التربيع/الجذر"}
      - {value: "0.5 * C_uF * U**2 * 1e-3 if ask == 'E' else sqrt(2 * E / L_mH)", rule: unit_confusion, rationale: "تحويل μF/mH خاطئ"}
  rubric:
    - {step: "E = ½·C·U² = ½·L·Imax²", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "E = Qmax²/2C = ½CU² = ½LImax² (الكتاب ص ١٣٣)"
  approved: false

- id: U2.L4.T03
  title: "مفاهيم الدارة المهتزة — أشكال التفريغ، تبادل الطاقة، الطور"
  chapter: U2C4
  type: mcq
  difficulty: 1
  weight: 10
  source: {book: "ص ١٢٦–١٣٧", lesson: "L4 §١ §٣ §٤ [أستاذ س١ س٤ س٥]"}
  variants:
    - stem: "يكون تفريغ المكثفة عبر وشيعة دورياً غير متخامد عندما تكون المقاومة الأومية للدارة:"
      key: "مهملة"
      distractors:
        - {text: "صغيرة", rule: true_but_partial, rationale: "صغيرة ⇒ متخامد"}
        - {text: "كبيرة جداً", rule: mix_formulas, rationale: "كبيرة ⇒ لا دوري"}
        - {text: "أي قيمة", rule: mix_formulas}
    - stem: "في الدارة المهتزة LC، عندما تكون شحنة المكثفة عظمى فإن شدة التيار في الوشيعة:"
      key: "معدومة"
      distractors:
        - {text: "عظمى", rule: sin_cos, rationale: "i متقدم على q بربع دور"}
        - {text: "تساوي نصف قيمتها العظمى", rule: mix_formulas}
        - {text: "لا يمكن تحديدها", rule: mix_formulas}
    - stem: "تنتقل الطاقة في الدارة المهتزة غير المتخامدة:"
      key: "من كهربائية في المكثفة إلى كهرطيسية في الوشيعة وبالعكس، ومجموعهما ثابت"
      distractors:
        - {text: "من المكثفة إلى الوشيعة حيث تُستهلك", rule: power_in_LC}
        - {text: "تتناقص باستمرار بفعل جول", rule: true_but_partial, rationale: "ذاك مع مقاومة"}
        - {text: "تبقى كلها في المكثفة", rule: mix_formulas}
    - stem: "بمقارنة الدارة المهتزة بالنواس المرن، تقابل الذاتية L:"
      key: "الكتلة m"
      distractors:
        - {text: "ثابت الصلابة k", rule: LC_inverted, rationale: "1/C ↔ k"}
        - {text: "المطال x", rule: mix_formulas, rationale: "q ↔ x"}
        - {text: "السرعة v", rule: mix_formulas, rationale: "i ↔ v"}
    - stem: "يتقدم تابع شدة التيار على تابع الشحنة في الدارة المهتزة بالطور بمقدار:"
      key: "π/2 (ربع دور)"
      distractors:
        - {text: "π (نصف دور)", rule: mix_formulas}
        - {text: "صفر (توافق بالطور)", rule: mix_formulas}
        - {text: "2π (دور كامل)", rule: mix_formulas}
  answer_basis: "الكتاب ص ١٢٨–١٣٣ [أستاذ س١ س٤ س٥]"
  approved: false

# ───────────────────────────── L5 — التيار المتناوب (U2C5) ─────────────────────────────

- id: U2.L5.T01
  title: "القيم المنتجة والعظمى والنبض من التابع اللحظي"
  chapter: U2C5
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ١٤٠–١٤٢", lesson: "L5 §٢ [أستاذ]", exam: "٢٠٢٦ مسألة ٣: u = 120√2·cos(120πt)"}
  vars:
    Ueff: {set: [110, 120, 220, 240]}
    f: {set: [50, 60]}
    ask: {set: ["Umax", "T", "omega"]}
  compute:
    Umax: "Ueff * 1.414"
    omega: "2 * pi_approx * f"
    T: "1 / f"
    key: "{'Umax': Umax, 'T': T, 'omega': omega}[ask]"
    unit: "{'Umax': 'V', 'T': 's', 'omega': 'rad·s⁻¹'}[ask]"
    qtxt: "{'Umax': 'القيمة العظمى للتوتر Umax (√2 = 1.414)', 'T': 'الدور T', 'omega': 'النبض ω (π = 3.14)'}[ask]"
  stem: "منبع توتر متناوب جيبي قيمته المنتجة {Ueff} V وتواتره {f} Hz. احسب {qtxt}."
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "{'Umax': Ueff / 1.414, 'T': f, 'omega': f}[ask]", rule: forget_sqrt2, rationale: "قسم على √2 بدل الضرب / خلط f بـT أو ω"}
      - {value: "{'Umax': Ueff * 2, 'T': 2 * pi_approx / f, 'omega': pi_approx * f}[ask]", rule: forget_2pi, rationale: "خلط 2 بـ√2 / 2π في غير موضعه"}
      - {value: "{'Umax': Ueff, 'T': 1 / (2 * pi_approx * f), 'omega': 1 / f}[ask]", rule: mix_formulas, rationale: "علاقة مقدار آخر"}
  rubric:
    - {step: "Umax = Ueff·√2 · ω = 2πf · T = 1/f", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "Ueff = Umax/√2 (الكتاب ص ١٤١)"
  approved: false

- id: U2.L5.T02
  title: "الممانعة الكلية Z لدارة RLC على التسلسل"
  chapter: U2C5
  type: numeric
  difficulty: 3
  weight: 10
  source: {book: "ص ١٥٠–١٥١", lesson: "L5 §٥ القواعد الخمس + فرينل [أستاذ]", exam: "٢٠٢٦ مسألة ٣ (٨٠)"}
  vars:
    R: {set: [30, 40, 60, 80, 120]}
    XL: {set: [40, 60, 80, 100, 120, 160]}
    XC: {set: [0, 20, 40, 60, 80, 100]}
  compute:
    X: "XL - XC"
    key: "sqrt(R**2 + X**2)"
    ctxt: "'' if XC == 0 else f' ومكثفة اتساعيتها 1/Cω = {XC} Ω'"
  constraints:
    - "X != 0 and abs(key - round(key)) < 1e-9"
  stem: "دارة على التسلسل تضم مقاومة R = {R} Ω ووشيعة مهملة المقاومة ردّيتها Lω = {XL} Ω{ctxt}. احسب الممانعة الكلية Z للدارة."
  answer: {unit: "Ω"}
  options:
    distractors:
      - {value: "R + abs(X)", rule: Z_algebraic, rationale: "جمع جبري بدل فيثاغورث"}
      - {value: "sqrt(R**2 + (XL + XC)**2)", rule: XL_XC_swap, rationale: "جمع Lω و1/Cω بدل طرحهما"}
      - {value: "sqrt(R**2 + X**2) - R if key - R > 1 else abs(X)", rule: mix_formulas, rationale: "أهمل R"}
  rubric:
    - {step: "Z = √(R² + (Lω − 1/Cω)²)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة Ω", points: 1}
  answer_basis: "Z = √(R² + (Lω − 1/Cω)²) (الكتاب ص ١٥١)"
  approved: false

- id: U2.L5.T03
  title: "الاستطاعة المتوسطة وعامل الاستطاعة"
  chapter: U2C5
  type: numeric
  difficulty: 3
  weight: 10
  source: {book: "ص ١٤٣–١٤٥، ١٥١", lesson: "L5 §٣ [أستاذ]", exam: "٢٠٢٦ مسألة ٣"}
  vars:
    R: {set: [30, 40, 60, 80]}
    Z: {set: [50, 100]}
    Ueff: {set: [100, 120, 200, 220]}
    ask: {set: ["P", "cosphi"]}
  constraints:
    - "R < Z"
  compute:
    Ieff: "Ueff / Z"
    P: "R * Ieff**2"
    cosphi: "R / Z"
    key: "P if ask == 'P' else cosphi"
    qtxt: "'الاستطاعة المتوسطة المستهلكة في الدارة' if ask == 'P' else 'عامل الاستطاعة cos φ'"
    unit: "'W' if ask == 'P' else ''"
  stem: "دارة RLC على التسلسل مقاومتها R = {R} Ω وممانعتها Z = {Z} Ω مغذّاة بتوتر منتج {Ueff} V. احسب {qtxt}."
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "Z * Ieff**2 if ask == 'P' else Z / R", rule: power_in_LC, rationale: "استعمل Z مكان R (الطاقة تُصرف في R فقط) / قلب النسبة"}
      - {value: "Ueff * Ieff if ask == 'P' else sqrt(1 - (R / Z)**2)", rule: mix_formulas, rationale: "الاستطاعة الظاهرية / sin φ"}
      - {value: "R * Ieff if ask == 'P' else R / Z * 100", rule: forget_square, rationale: "أهمل التربيع / نسبة مئوية"}
  rubric:
    - {step: "Ieff = Ueff/Z ثم P = R·Ieff² (أو cos φ = R/Z)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "P = Ueff·Ieff·cos φ = R·Ieff² و cos φ = R/Z (الكتاب ص ١٤٥، ١٥١)"
  approved: false

- id: U2.L5.T04
  title: "مفاهيم التيار المتناوب — الطور، الممانعات، الطنين، الاستطاعة"
  chapter: U2C5
  type: mcq
  difficulty: 2
  weight: 10
  source: {book: "ص ١٤٦–١٥٤", lesson: "L5 §٤ الجدول الذهبي + §٦ الطنين [أستاذ س٣–س٦]"}
  variants:
    - stem: "في دارة تحوي وشيعة مهملة المقاومة فقط، يكون التوتر بين طرفيها:"
      key: "متقدماً بالطور على التيار بربع دور"
      distractors:
        - {text: "متأخراً بالطور عن التيار بربع دور", rule: XL_XC_swap, rationale: "هذه المكثفة"}
        - {text: "على توافق بالطور مع التيار", rule: mix_formulas, rationale: "هذه المقاومة"}
        - {text: "متقدماً بنصف دور", rule: mix_formulas}
    - stem: "اتساعية المكثفة 1/(Cω) تنقص عندما:"
      key: "يزداد تواتر التيار"
      distractors:
        - {text: "ينقص تواتر التيار", rule: invert_ratio}
        - {text: "تنقص سعة المكثفة", rule: invert_ratio}
        - {text: "يزداد التوتر المطبق", rule: mix_formulas}
    - stem: "في حالة الطنين الكهربائي في دارة RLC على التسلسل:"
      key: "Lω = 1/(Cω) وتكون الممانعة أصغر ما يمكن وتساوي R"
      distractors:
        - {text: "تكون الممانعة أكبر ما يمكن", rule: mix_formulas}
        - {text: "ينعدم التوتر بين طرفي الوشيعة والمكثفة كل على حدة", rule: true_but_partial, rationale: "ينعدم مجموعهما الشعاعي فقط"}
        - {text: "يكون فرق الطور بين u وi يساوي π/2", rule: mix_formulas, rationale: "φ = 0"}
    - stem: "الاستطاعة المتوسطة المستهلكة في مكثفة مثالية في دارة تيار متناوب:"
      key: "معدومة لأن cos φ = 0"
      distractors:
        - {text: "تساوي Ueff·Ieff", rule: power_in_LC}
        - {text: "تساوي Ieff²/(Cω)", rule: power_in_LC}
        - {text: "تساوي نصف الاستطاعة الظاهرية", rule: mix_formulas}
    - stem: "القيمة المنتجة لتيار متناوب هي شدة التيار المتواصل الذي:"
      key: "يُحدث في المقاومة نفسها الأثر الحراري نفسه في المدة نفسها"
      distractors:
        - {text: "له القيمة العظمى نفسها", rule: forget_sqrt2}
        - {text: "له القيمة المتوسطة نفسها", rule: mix_formulas, rationale: "متوسط الجيبي صفر"}
        - {text: "يُحدث الحقل المغناطيسي نفسه", rule: mix_formulas}
    - stem: "تُعطى الاستطاعة المتوسطة في دارة RLC على التسلسل بالعلاقة:"
      key: "P = Ueff·Ieff·cos φ = R·Ieff²"
      distractors:
        - {text: "P = Ueff·Ieff", rule: mix_formulas, rationale: "الظاهرية"}
        - {text: "P = Z·Ieff²", rule: power_in_LC}
        - {text: "P = Umax·Imax", rule: forget_sqrt2}
  answer_basis: "الكتاب ص ١٤٦–١٥٤ [أستاذ]"
  approved: false

# ───────────────────────────── L6 — المحوّلات (U2C6) ─────────────────────────────

- id: U2.L6.T01
  title: "نسبة التحويل — التوتر أو التيار أو عدد اللفات"
  chapter: U2C6
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ١٦٤–١٦٦", lesson: "L6 §٣ [أستاذ]", exam: "٢٠٢٦ س١-٢"}
  vars:
    Np: {set: [200, 400, 500, 1000, 2000]}
    Ns: {set: [50, 100, 200, 400, 1000, 4000]}
    Up: {set: [110, 220, 240]}
    Ip: {set: [0.5, 1, 2, 4]}
    ask: {set: ["Us", "Is"]}
  constraints:
    - "Np != Ns"
    - "abs(key - round(key, 2)) < 1e-9"
  compute:
    Us: "Up * Ns / Np"
    Is: "Ip * Np / Ns"
