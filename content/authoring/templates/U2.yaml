    - {step: "التحويلات والتعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة V", points: 1}
  answer_basis: "e = −N·ΔΦ/Δt (الكتاب ص ١١٠)"
  approved: false

- id: U2.L3.T02
  title: "الطاقة الكهرطيسية المختزنة في وشيعة / القوة المحركة الذاتية"
  chapter: U2C3
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ١١٨–١٢٠", lesson: "L3 §٦–§٧ [أستاذ س٩–س١١]"}
  vars:
    ask: {set: ["E", "e"]}
    L_mH: {set: [20, 50, 100, 200, 500]}
    I: {set: [2, 4, 5, 10]}
    di_dt: {set: [10, 20, 50, 100]}
  compute:
    L: "L_mH * 1e-3"
    key: "0.5 * L * I**2 if ask == 'E' else L * di_dt"
    qtxt: "f'وشيعة ذاتيتها {L_mH} mH يمر فيها تيار شدته {I} A. احسب الطاقة الكهرطيسية المختزنة فيها.' if ask == 'E' else f'وشيعة ذاتيتها {L_mH} mH يتغير التيار فيها بمعدل {di_dt} A·s⁻¹. احسب القيمة المطلقة للقوة المحركة الذاتية.'"
    unit: "'J' if ask == 'E' else 'V'"
  stem: "{qtxt}"
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "L * I**2 if ask == 'E' else 0.5 * L * di_dt", rule: forget_half, rationale: "أهمل ½ أو أضافه في غير موضعه"}
      - {value: "0.5 * L * I if ask == 'E' else L / di_dt", rule: forget_square, rationale: "أهمل التربيع / قسم بدل الضرب"}
      - {value: "0.5 * L_mH * I**2 if ask == 'E' else L_mH * di_dt", rule: unit_confusion, rationale: "لم يحوّل mH ⇒ H"}
  rubric:
