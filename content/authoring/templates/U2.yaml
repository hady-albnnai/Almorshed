# قوالب الأسئلة — الوحدة ٢ (الكهرباء والمغناطيسية) — U2C1…U2C6
# المصادر: content/authoring/U2/L1…L6 (الكتاب ص ٦٨–١٦٧ + ملخصات الأستاذ فداء)
#          + السلم الوزاري ٢٠٢٦ (docs/20 §٢): مسألة ٣ التيار المتناوب ٨٠ · مسألة ٢ الإطار ٤٥ ·
#            س٤ ثبات الطاقة ٣٠ · س٣-٣ السكتان ٢٥ · س٢-١ النفوذية ٢٠ · س١-٢ المحولة
# المحرّك: from_compute العام (vars/constraints/compute) + variants للمفاهيمي
# ضوابط: approved:false · المفتاح من قانون الكتاب في answer_basis · كل مشتت بقاعدة موثقة
# تم الإشراف على المادة العلمية من قبل الأستاذ القدير فداء مأمون البني
