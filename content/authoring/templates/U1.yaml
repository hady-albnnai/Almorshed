- id: U1.L2.T03
  title: "تمييز العلاقة الصحيحة (نواس الفتل)"
  chapter: U1C2
  type: mcq
  difficulty: 1
  weight: 10
  source: {bank_idx: [1, 2, 5, 10, 13, 14, 16, 22, 23, 24, 25, 26, 32, 40], book: "ص ٢٢–٢٧", lesson: "L2 الخلاصة"}
  vars:
    q: {set: [fund, Gamma, C_wire, alpha, omega0, T0, Ep, Ek, ode, dEp, dEk, omega_t, C_all, Ek_all]}
  table:
    fund:    {stem: "عند دراسة حركة نواس الفتل نستخدم العلاقة الأساسية في التحريك الدوراني:", key: "ΣΓ/Δ = IΔ·θ″"}
    Gamma:   {stem: "يُعطى عزم مزدوجة الفتل بالعلاقة:", key: "Γ_η/Δ = −C·θ"}
    C_wire:  {stem: "يُعطى ثابت فتل السلك C بدلالة أبعاده بالعلاقة:", key: "C ∝ r⁴/l (يزداد بالأس الرابع لنصف القطر ويتناقص مع الطول)"}
    alpha:   {stem: "يُعطى التسارع الزاوي لنواس فتل غير متخامد بالعلاقة:", key: "θ″ = −ω0²·θ"}
    omega0:  {stem: "النبض الخاص لنواس الفتل غير المتخامد هو:", key: "ω0 = √(C/IΔ)"}
    T0:      {stem: "دور نواس الفتل غير المتخامد T0 هو:", key: "T0 = 2π·√(IΔ/C)"}
    Ep:      {stem: "الطاقة الكامنة المرونية لنواس الفتل تُعطى بالعلاقة:", key: "Ep = ½·C·θ²"}
    Ek:      {stem: "الطاقة الحركية الدورانية لنواس الفتل تُعطى بالعلاقة:", key: "Ek = ½·IΔ·θ′²"}
    ode:     {stem: "المعادلة التفاضلية من المرتبة الثانية لنواس الفتل غير المتخامد التي تقبل حلاً جيبياً هي:", key: "θ″ = −(C/IΔ)·θ"}
    dEp:     {stem: "مشتق الطاقة الكامنة المرونية لنواس الفتل بالنسبة للزمن هو:", key: "C·θ·θ′"}
    dEk:     {stem: "مشتق الطاقة الحركية الدورانية لنواس الفتل بالنسبة للزمن هو:", key: "IΔ·θ′·θ″"}
    omega_t: {stem: "يُعطى التابع الزمني للسرعة الزاوية لنواس الفتل بالعلاقة:", key: "θ′ = −ω0·θmax·sin(ω0·t + φ)"}
    C_all:   {stem: "يُعطى ثابت فتل السلك C بالعلاقة:", key: "جميع ما سبق صحيح (C = IΔ·ω0² · C = 4π²IΔ/T0² · C = −Γ/θ)"}
    Ek_all:  {stem: "الطاقة الحركية الدورانية لنواس الفتل تُعطى بالعلاقة:", key: "جميع ما سبق صحيح (Ek = E − Ep · Ek = ½IΔθ′² · Ek = ½C(θmax² − θ²))"}
  stem: "{table[q].stem}"
  options:
    key: "{table[q].key}"
    distractor_generation:
      - {rule: sign_flip, rationale: "حذف الإشارة السالبة"}
      - {rule: invert_ratio, rationale: "IΔ/C ↔ C/IΔ"}
      - {rule: forget_square, rationale: "θ بدل θ² أو ω0 بدل ω0²"}
      - {rule: sin_cos, rationale: "cos بدل sin في السرعة الزاوية"}
      - {rule: exponent4, rationale: "r² بدل r⁴ أو l في البسط"}
      - {rule: mix_pendulums, rationale: "m بدل IΔ أو k بدل C (علاقات المرن)"}
      - {rule: true_but_partial, rationale: "لقوالب «جميع ما سبق»"}
  rubric: [{step: "الاختيار الصحيح", points: 10}]
  answer_basis: "الكتاب ص ٢٢–٢٧"
  review_notes:
    - "رمز ثابت الفتل: الكتاب C (L2 والدفتر) بينما glossary.json يستعمل K وبنك المصدر يكتب K = k(2r)⁴/l بالقطر. يُثبَّت الرمز وصيغة ص ٢٥ (r⁴ أم (2r)⁴) حرفياً مع الأستاذ قبل التوليد؛ إلى حينها لا يُولَّد صف C_wire."
  approved: false

