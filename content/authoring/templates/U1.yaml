        - {text: "قوة الثقل w⃗ وقوة توتر النابض F⃗s وقوة الإرجاع F⃗", rule: mix_pendulums, rationale: "قوة الإرجاع هي المحصلة لا قوة مستقلة"}
        - {text: "قوة توتر النابض فقط", rule: mix_pendulums, rationale: "الثقل موجود"}
    - stem: "يخضع الجسم الصلب في النواس المرن الأفقي غير المتخامد في حالة الحركة لتأثير القوى الخارجية:"
      key: "قوة الثقل w⃗ وقوة رد فعل المستوي R⃗ وقوة توتر النابض F⃗s"
      distractors:
        - {text: "قوة الثقل w⃗ وقوة توتر النابض F⃗s فقط", rule: mix_pendulums, rationale: "المستوي يرد على الثقل"}
        - {text: "قوة توتر النابض F⃗s فقط", rule: mix_pendulums, rationale: "الثقل ورد الفعل يتوازنان لكنهما موجودان"}
        - {text: "قوة الثقل w⃗ وقوة الإرجاع F⃗", rule: mix_pendulums, rationale: "الإرجاع محصلة لا قوة"}
  rubric: [{step: "الاختيار الصحيح", points: 10}]
  answer_basis: "حالة السكون w − Fs0 = 0 ⇒ Fs0 = k·x0 · حالة الحركة Fs = k(x0 + x) (الكتاب ص ١٠–١١)"
  approved: false

- id: U1.L1.T08
  title: "نسب الدور/النبض عند تغيير الكتلة أو ثابت الصلابة أو السعة"
  chapter: U1C1
  type: mcq
  difficulty: 2
  weight: 10
  source: {bank_idx: [4, 36, 62, 110, 111], book: "ص ١٢", lesson: "L1 §٥ مسائل النسبة [أستاذ]", exam: "نمط ٢٠٢٦ س١-١"}
  vars:
    fm: {set: [0.25, 0.5, 1, 2, 3, 4], desc: "m′/m"}
    fk: {set: [0.25, 0.5, 1, 2, 4], desc: "k′/k"}
    fx: {set: [1, 2, 0.5], desc: "XmaX′/XmaX — لا أثر"}
    ask: {set: ["T0", "ω0"]}
  constraints:
    - "not (fm == 1 and fk == 1 and fx == 1)"
    - "sqrt(fm/fk) in (0.25, 0.5, 1, 2, 4) or fm == 3"
  compute:
    rT: "sqrt(fm/fk)"
    rW: "sqrt(fk/fm)"
    key: "rT if ask == 'T0' else rW"
  stem: "نواس مرن غير متخامد دوره T0 ونبضه ω0. نجعل كتلة الجسم {fm}·m وثابت صلابة النابض {fk}·k وسعة الاهتزاز {fx}·XmaX. يصبح {ask}′:"
  options:
    key: "{key}·{ask}"
    distractors:
      - {value: "fm/fk if ask == 'T0' else fk/fm", rule: forget_sqrt, rationale: "نسي الجذر"}
      - {value: "rW if ask == 'T0' else rT", rule: invert_ratio, rationale: "قلب النسبة"}
      - {value: "fx if fx != 1 else 1/sqrt(fm/fk) * 0 + (2 if key != 2 else 0.5)", rule: amplitude_dependence, rationale: "ظنّ السعة تؤثر / أو اختار قيمة لا تتغير"}
  rubric:
    - {step: "T0′/T0 = √(m′/m)·√(k/k′)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 2}
  answer_basis: "T0 = 2π√(m/k) لا يتعلق بالسعة (الكتاب ص ١٢)"
  approved: false

- id: U1.L1.T09
  title: "الدور والتواتر والنبض من العدّ (n هزة في Δt)"
  chapter: U1C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {bank_idx: [14, 33, 43, 50, 52, 71], book: "ص ٩، ١٩ م٣", lesson: "L1 مثال ٢ (قراءة المعطيات المخفية)"}
  vars:
    n:  {set: [4, 5, 8, 10, 12, 20, 25]}
    dt: {set: [2, 3, 4, 5, 8, 10, 20], unit: s}
    ask: {set: [T0, f, omega0, n_from_T0, t_from_n_T0]}
  constraints: ["(dt / n) in (0.1, 0.2, 0.25, 0.4, 0.5, 0.8, 1, 2, 4, 5)"]
  compute:
    T0: "dt / n"
    f: "n / dt"
    omega0: "2*pi / T0"
  stem: "نواس مرن غير متخامد ينجز {n} هزة خلال {dt} s. احسب {ask}."
  options:
    key: {T0: "{T0} s", f: "{f} Hz", omega0: "{omega0} rad·s⁻¹", n_from_T0: "{n} هزة", t_from_n_T0: "{dt} s"}
    distractors:
      - {value: "n/dt for T0 | dt/n for f", rule: invert_ratio, rationale: "قلب الدور والتواتر"}
      - {value: "n/dt for omega0", rule: forget_2pi, rationale: "ω0 = 2πf لا f"}
      - {value: "2*pi*T0 for omega0", rule: invert_ratio, rationale: "ω0 = 2π/T0 لا 2πT0"}
  rubric:
    - {step: "T0 = زمن الهزات / عددها (أو f = 1/T0 · ω0 = 2π/T0)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1, keys: ["s", "Hz", "rad·s⁻¹"]}
  answer_basis: "T0 = Δt/n · f = 1/T0 · ω0 = 2π/T0 (الكتاب ص ٩، ١٢)"
  approved: false

- id: U1.L1.T10
  title: "الكتلة أو ثابت الصلابة أو الدور من T0 = 2π√(m/k) (π² = 10)"
  chapter: U1C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {bank_idx: [81, 85, 91, 94, 99, 136, 142, 146, 160], book: "ص ١٢، ١٩", lesson: "L1 مثال ١ (٢) ومثال ٣ (٤)"}
  vars:
    m:  {set: [0.1, 0.16, 0.2, 0.25, 0.4, 0.5, 1, 2], unit: kg}
    k:  {set: [1.25, 4, 10, 16, 20, 40], unit: "N·m⁻¹"}
    T0: {set: [0.4, 0.5, 0.8, 1, 2, 4], unit: s}
    ask: {set: [k, m, T0]}
  constants_used: {pi_sq: 10}
  constraints: ["ask != 'k' or (4*pi_sq*m/T0**2) in k.set", "ask != 'm' or (k*T0**2/(4*pi_sq)) in m.set", "ask != 'T0' or (2*sqrt(pi_sq)*sqrt(m/k)) in T0.set"]
  compute:
    k_val: "4*pi_sq*m/T0**2"
    m_val: "k*T0**2/(4*pi_sq)"
    T0_val: "2*sqrt(pi_sq*m/k)"
  stem: "نواس مرن غير متخامد {given}. احسب {ask} (خذ π² = 10)."
  options:
    key: {k: "{k_val} N·m⁻¹", m: "{m_val} kg", T0: "{T0_val} s"}
    distractors:
      - {value: "4*pi_sq*m/T0 (k) | k*T0/(4*pi_sq) (m)", rule: forget_square, rationale: "نسي تربيع T0"}
      - {value: "m/T0**2 (k) | k*T0**2 (m)", rule: forget_4pi2, rationale: "نسي 4π²"}
      - {value: "T0**2/(4*pi_sq*m) (k) | 4*pi_sq/(k*T0**2) (m)", rule: invert_ratio, rationale: "قلب العلاقة"}
      - {value: "m*1000 handling", rule: unit_g_kg, rationale: "ترك الكتلة بالغرام"}
  rubric:
    - {step: "T0 = 2π√(m/k) ⇒ عزل المطلوب", points: 5}
    - {step: "التعويض مع π² = 10", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1, keys: ["N·m⁻¹", "kg", "s"]}
  answer_basis: "T0 = 2π√(m/k) (الكتاب ص ١٢)"
  approved: false

- id: U1.L1.T11
  title: "قوة الإرجاع أو التسارع في مطال معلوم"
  chapter: U1C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {bank_idx: [80, 82, 96, 101], book: "ص ١١، ١٤", lesson: "L1 مثال ٢ (٣) ومثال ٣ (٣)"}
  vars:
    k:    {set: [8, 10, 16, 20, 40], unit: "N·m⁻¹"}
    x_cm: {set: [-5, -4, -2, -0.5, 0.5, 2, 4, 5], unit: cm}
    T0:   {set: [0.5, 1, 2], unit: s}
    ask:  {set: [F, a]}
  constants_used: {pi_sq: 10}
  compute:
    x: "x_cm/100"
    F: "-k*x"
    omega0_sq: "4*pi_sq/T0**2"
    a: "-omega0_sq*x"
  stem: "نواس مرن غير متخامد {given}. احسب {ask} في الموضع الذي مطاله x = {x_cm} cm (π² = 10)."
  options:
    key: {F: "{F} N", a: "{a} m·s⁻²"}
    distractors:
      - {value: "+k*x | +omega0_sq*x", rule: sign_flip, rationale: "أهمل الإشارة السالبة (نحو المركز)"}
      - {value: "-k*x_cm | -omega0_sq*x_cm", rule: unit_cm_m, rationale: "لم يحوّل إلى m"}
      - {value: "-sqrt(omega0_sq)*x", rule: mix_v_a, rationale: "استعمل ω0 بدل ω0²"}
  rubric:
    - {step: "F = −k·x أو a = −ω0²·x", points: 5}
    - {step: "التعويض (x بالمتر)", points: 3}
    - {step: "النتيجة بإشارتها", points: 1}
    - {step: "الوحدة", points: 1, keys: ["N", "m·s⁻²"]}
  answer_basis: "F = −k·x (ص ١١) · a = −ω0²·x (ص ١٤)"
  approved: false

- id: U1.L1.T12
  title: "السرعة العظمى والسرعة في مطال معلوم"
  chapter: U1C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {bank_idx: [84, 89, 150], book: "ص ١٣، ١٥", lesson: "L1 §٦ §٧ (v = ω0√(XmaX² − x²))"}
  vars:
    XmaX_cm: {set: [4, 5, 6, 8, 10], unit: cm}
    x_cm:    {set: [0, 3, 4, 6], unit: cm}
    omega0:  {set: [2, 4, 5, 10, "2π", "π"], unit: "rad·s⁻¹"}
    ask:     {set: [vmax, v_at_x]}
  constraints: ["x_cm < XmaX_cm", "ask != 'v_at_x' or sqrt(XmaX_cm**2 - x_cm**2) == int(sqrt(XmaX_cm**2 - x_cm**2))"]
  compute:
    XmaX: "XmaX_cm/100"
    x: "x_cm/100"
    vmax: "omega0*XmaX"
    v: "omega0*sqrt(XmaX**2 - x**2)"
  stem: "نواس مرن غير متخامد نبضه ω0 = {omega0} rad·s⁻¹ وسعته {XmaX_cm} cm. احسب {ask}."
  options:
    key: {vmax: "{vmax} m·s⁻¹", v_at_x: "±{v} m·s⁻¹"}
    distractors:
      - {value: "omega0*x", rule: mix_max_center, rationale: "استعمل المطال مكان الجذر"}
      - {value: "omega0*(XmaX - x)", rule: forget_sqrt, rationale: "طرح بلا تربيع وجذر"}
      - {value: "omega0**2*XmaX", rule: mix_v_a, rationale: "هذا amax"}
      - {value: "omega0*XmaX_cm", rule: unit_cm_m, rationale: "cm"}
  rubric:
    - {step: "vmax = ω0·XmaX أو v = ±ω0√(XmaX² − x²)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة (± عند طلب السرعة في مطال)", points: 1}
    - {step: "الوحدة", points: 1, keys: ["m·s⁻¹"]}
  answer_basis: "vmax = ω0·XmaX (ص ١٣) · من الطاقة v = ±ω0√(XmaX² − x²) (ص ١٥)"
  approved: false

- id: U1.L1.T13
  title: "الطاقة الميكانيكية والكامنة والحركية عددياً"
  chapter: U1C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {bank_idx: [92, 95, 121, 157, 176], book: "ص ١٥–١٦، ١٩ م٣", lesson: "L1 مثال ٢ (٤)"}
  vars:
    k:       {set: [4, 10, 16, 20, 40], unit: "N·m⁻¹"}
    XmaX_cm: {set: [4, 5, 8, 10, 16], unit: cm}
    x_cm:    {set: [2, 3, 4, 6], unit: cm}
    ask:     {set: [E, Ep, Ek, k_from_E]}
  constraints: ["x_cm < XmaX_cm"]
  compute:
    XmaX: "XmaX_cm/100"
    x: "x_cm/100"
    E: "0.5*k*XmaX**2"
    Ep: "0.5*k*x**2"
    Ek: "E - Ep"
    k_from_E: "2*E/XmaX**2"
  stem: "نواس مرن غير متخامد ثابت صلابة نابضه {k} N·m⁻¹ يهتز بسعة {XmaX_cm} cm. احسب {ask} في الموضع x = {x_cm} cm."
  options:
    key: {E: "{E} J", Ep: "{Ep} J", Ek: "{Ek} J", k_from_E: "{k_from_E} N·m⁻¹"}
    distractors:
      - {value: "k*XmaX**2 | k*x**2", rule: forget_half, rationale: "نسي ½"}
      - {value: "0.5*k*XmaX | 0.5*k*x", rule: forget_square, rationale: "نسي التربيع"}
      - {value: "0.5*k*x**2 for Ek", rule: mix_Ep_Ek, rationale: "حسب Ep وسمّاها Ek"}
      - {value: "0.5*k*XmaX_cm**2", rule: unit_cm_m, rationale: "cm"}
  rubric:
    - {step: "E = ½k·XmaX² · Ep = ½k·x² · Ek = E − Ep", points: 5}
    - {step: "التعويض (بالمتر)", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1, keys: ["J"]}
  answer_basis: "الكتاب ص ١٥–١٦"
  approved: false

- id: U1.L1.T14
  title: "نسب الطاقة بحسب الموضع (x = XmaX/n، تساوي الطاقتين، Ep = r·Ek)"
  chapter: U1C1
  type: mcq
  difficulty: 2
  weight: 10
  source: {bank_idx: [116, 124, 127, 128, 129, 139, 161, 162, 163, 174, 175], book: "ص ١٥–١٦", lesson: "L1 §٧ + docs/15 §٨٧ (أُهمل سابقاً لغياب المفتاح — هنا يُشتق حسابياً)"}
  vars:
    mode: {set: [Ep_at_frac, Ek_at_frac, x_for_equal, x_for_Ek_r_Ep, x_for_Ep_r_E, x_for_Ek_r_E]}
    n:    {set: [2, 3, 4, "√2", "√3", "√5"]}
    r:    {set: [0.12, 0.2, 0.25, 0.5, 0.8, 3]}
  compute:
    Ep_frac: "1/n**2"                       # Ep/E عند x = XmaX/n
    Ek_frac: "1 - 1/n**2"
    x_equal: "XmaX/sqrt(2)"                 # Ep = Ek
    x_Ek_r_Ep: "XmaX/sqrt(1 + r)"           # Ek = r·Ep ⇒ x² = XmaX²/(1+r)
    x_Ep_r_E: "XmaX*sqrt(r)"                # Ep = r·E
    x_Ek_r_E: "XmaX*sqrt(1 - r)"            # Ek = r·E
  stems:
    Ep_at_frac: "قيمة الطاقة الكامنة المرونية في نقطة مطالها x = XmaX/{n} هي:"
    Ek_at_frac: "قيمة الطاقة الحركية في نقطة مطالها x = XmaX/{n} هي:"
    x_for_equal: "في النواس المرن غير المتخامد تتساوى الطاقتان الكامنة والحركية عندما يكون المطال:"
    x_for_Ek_r_Ep: "في أي موضع x من مسار الجسم تكون Ek = {r}·Ep؟"
    x_for_Ep_r_E: "في أي موضع x من مسار الجسم تكون Ep = {r}·E؟"
    x_for_Ek_r_E: "في أي موضع x من مسار الجسم تكون Ek = {r}·E؟"
  options:
    key:
      Ep_at_frac: "Ep = E/{n²}"
      Ek_at_frac: "Ek = ({n²} − 1)·E/{n²}"
      x_for_equal: "x = ±XmaX/√2"
      x_for_Ek_r_Ep: "x = ±XmaX/√(1 + {r})"
      x_for_Ep_r_E: "x = ±XmaX·√{r}"
      x_for_Ek_r_E: "x = ±XmaX·√(1 − {r})"
    distractors:
      - {rule: forget_square, rationale: "Ep/E = 1/n بدل 1/n²"}
      - {rule: forget_pm, rationale: "موضع واحد بدل موضعين متناظرين"}
      - {rule: mix_Ep_Ek, rationale: "قلب Ep وEk"}
      - {rule: invert_ratio, rationale: "√(1+r) في البسط"}
  rubric:
    - {step: "Ep = ½kx² · E = ½kXmaX² ⇒ Ep/E = x²/XmaX²", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة مع ±", points: 2}
  answer_basis: "E = ½kXmaX² · Ep = ½kx² (الكتاب ص ١٥–١٦)"
  approved: false

- id: U1.L1.T15
  title: "الاستطالة السكونية عددياً وقوة توتر النابض عند السكون"
  chapter: U1C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {bank_idx: [51, 102, 153], book: "ص ١٠، ١٩ م٣", lesson: "L1 مثال ٢ (١)"}
  vars:
    m:  {set: [0.1, 0.16, 0.2, 0.5, 1], unit: kg}
    k:  {set: [10, 20, 40], unit: "N·m⁻¹"}
    T0: {set: [1, 2, 4], unit: s}
    ask: {set: [x0_from_mk, x0_from_T0, Fs0]}
  constants_used: {g: 10, pi_sq: 10}
  compute:
    x0_mk: "m*g/k"
    x0_T0: "g*T0**2/(4*pi_sq)"      # لأن k/m = 4π²/T0²
    Fs0: "m*g"
  stem: "نواس مرن شاقولي غير متخامد {given}. احسب {ask} (g = 10 m·s⁻²، π² = 10)."
  options:
    key: {x0_from_mk: "{x0_mk} m", x0_from_T0: "{x0_T0} m", Fs0: "{Fs0} N"}
    distractors:
      - {value: "k/(m*g)", rule: invert_ratio, rationale: "قلب العلاقة"}
      - {value: "m/k", rule: mix_pendulums, rationale: "نسي g"}
      - {value: "m*1000*g/k", rule: unit_g_kg, rationale: "الكتلة بالغرام"}
      - {value: "g*T0/(4*pi_sq)", rule: forget_square, rationale: "نسي تربيع T0"}
  rubric:
    - {step: "حالة السكون w − Fs0 = 0 ⇒ m·g = k·x0 ⇒ x0 = m·g/k (تُستنتج لا تُكتب مباشرة)", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1, keys: ["m", "N"]}
  answer_basis: "الكتاب ص ١٠ · خصم السلم: كتابة x0 = mg/k دون استنتاج عند «استنتج»"
  approved: false

- id: U1.L1.T16
  title: "طول المسار وأزمنة الانتقال بين الطرفين"
  chapter: U1C1
  type: mcq
  difficulty: 2
  weight: 10
  source: {bank_idx: [75, 77, 97, 98, 151, 166, 167, 168], book: "ص ٩، ١٩ م٣", lesson: "L1 مثال ٢ (القطعة = 2XmaX)"}
  vars:
    mode: {set: [segment_len, time_end_to_end, path_n_osc, T0_from_path, XmaX_from_path, omega0_from_time]}
    XmaX_cm: {set: [4, 5, 6, 8, 10]}
    n:  {set: [5, 10, 20]}
    dt: {set: [2, 5, 10]}
    T0: {set: [1, 2, 4]}
  compute:
    segment_len: "2*XmaX"                 # من +XmaX إلى −XmaX
    time_end_to_end: "T0/2"
    path_n_osc: "4*n*XmaX"                # كل هزة 4XmaX
    T0_from_path_8X: "dt/2"               # مسار 8XmaX = هزتان خلال dt
    XmaX_from_path: "path/(4*n)"
    omega0_from_time: "pi/dt"             # من +XmaX إلى −XmaX خلال dt = T0/2
  stems:
    segment_len: "طول القطعة المستقيمة التي يرسمها مركز عطالة الجسم عندما ينتقل من +XmaX إلى −XmaX هي:"
    time_end_to_end: "الزمن الذي يستغرقه مركز العطالة للانتقال من +XmaX إلى −XmaX هو:"
    path_n_osc: "نواس يهتز {n} هزة بسعة XmaX؛ طول المسار الذي يقطعه الجسم:"
    T0_from_path: "نواس يرسم مساراً طوله 8·XmaX خلال {dt} s؛ دوره:"
    XmaX_from_path: "نواس ينجز {n} هزة ويرسم مساراً مستقيماً طوله {path} cm؛ سعته:"
    omega0_from_time: "ينتقل الجسم من +XmaX إلى −XmaX خلال {dt} s؛ نبضه:"
  options:
