    - {n: 0, text: "ΣΓ/Δ = IΔ·θ″ · عزما w وT معدومان (حاملاهما على المحور) ⇒ −C·θ = IΔ·θ″ ⇒ θ″ = −(C/IΔ)·θ", points: 4}
    - {n: 6, text: "⇒ الحركة جيبية دورانية (كلمة «دورانية» مطلوبة)", points: 2}
  alt_route: "من E = ½Cθ² + ½IΔθ′² = const ⇒ نشتق: Cθθ′ + IΔθ′θ″ = 0 ⇒ ÷θ′ ⇒ θ″ + (C/IΔ)θ = 0"
