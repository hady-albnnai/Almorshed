- id: U1.PROOF.SHM
  title: "برهان: حركة النواس المرن جيبية + استنتاج T0"
  chapter: U1C1
  type: proof
  difficulty: 3
  weight: 25
  source: {exam: "٢٠٢٦ س٣-١ (٢٥) ✅ مؤكَّد بالسلم", lesson: "L1 🧮"}
  stem: "انطلاقاً من المعادلة التفاضلية x″ = −(k/m)·x برهن أن حركة الجسم جيبية انسحابية (توافقية بسيطة) ثم استنتج علاقة الدور الخاص."
  steps:
    - {n: 1, text: "معادلة تفاضلية من المرتبة الثانية تقبل حلاً جيبياً x = XmaX·cos(ω0·t + φ)", points: 5, penalty: {missing_phi: -1}}
    - {n: 2, text: "x′ = −ω0·XmaX·sin(ω0·t + φ)", points: 4}
    - {n: 3, text: "x″ = −ω0²·XmaX·cos(ω0·t + φ)", points: 4}
    - {n: 4, text: "x″ = −ω0²·x", points: 2, penalty: {missing_minus: -4}}
    - {n: 5, text: "بالمطابقة ω0² = k/m", points: 2}
    - {n: 6, text: "ω0 = √(k/m) > 0 لأن ما تحت الجذر موجب ⇒ الحركة جيبية", points: 2}
    - {n: 7, text: "ω0 = 2π/T0 ⇒ 2π/T0 = √(k/m)", points: 2}
    - {n: 8, text: "T0 = 2π·√(m/k)", points: 4}
  step_distractors:
    - {for_step: 1, wrong: "x = XmaX·cos(ω0·t)", rule: forget_pm, rationale: "بلا φ ⇒ −1"}
    - {for_step: 4, wrong: "x″ = ω0²·x", rule: sign_flip, rationale: "⇒ −4 (أثقل خصم مفرد في الورقة)"}
    - {for_step: 8, wrong: "T0 = 2π·√(k/m)", rule: invert_ratio, rationale: ""}
    - {for_step: 8, wrong: "T0 = √(m/k)", rule: forget_2pi, rationale: ""}
  answer_basis: "سلم ٢٠٢٦ (docs/20 §٢) · الكتاب ص ١٢"
  approved: false

