- id: U1.L2.T10
  title: "مسألة الجملة: IΔ (ساق/قرص/كتل نقطية) ⇒ T0 أو C أو l أو تابع المطال"
  chapter: U1C2
  type: problem
  difficulty: 3
  weight: 10
  source: {bank_idx: [27, 33, 52, 55, 62, 67, 77, 79, 80, 86, 87, 88, 89, 90, 91, 92, 94, 95, 96, 97, 98, 100, 101, 102, 103, 105], book: "ص ٢٧–٢٨", lesson: "L2 §٥ + مثال ١ + مثال ٢"}
  vars:
    body: {set: [rod_uniform, rod_massless_2masses, disk, disk_plus_rod, disk_plus_2masses]}
    m:    {set: [0.02, 0.1, 0.12, 0.2, 0.5, 1, 2], unit: kg}
    l:    {set: [0.08, 0.1, 0.2, 0.5, 1], unit: m}
    r:    {set: [0.02, 0.04, 0.05, 0.1, 0.2], unit: m}
    m1:   {set: [0.02, 0.075, 0.125, 0.2, 0.4, 0.75], unit: kg}
    C:    {set: [0.008, 0.072, 0.08, 0.4, 0.8], unit: "N·m·rad⁻¹"}
    T0:   {set: [0.5, 1, 2, 2.5, 4], unit: s}
    theta_max: {set: [0.1, 0.3, "π/3", "π/2"], unit: rad}
    ask:  {set: [I, T0, C, l, r, theta_t, omega_first_pass, E]}
  constants_used: {pi_sq: 10}
  compute:
    I_rod_uniform: "m*l**2/12"
    I_rod_massless_2masses: "2*m1*(l/2)**2"
    I_disk: "0.5*m*r**2"
    I_disk_plus_rod: "0.5*m*r**2 + m_rod*l_rod**2/12"
    I_disk_plus_2masses: "0.5*m*r**2 + 2*m1*r**2"
    T0_val: "2*sqrt(pi_sq*I/C)"
    C_val: "4*pi_sq*I/T0**2"
    l_from_T0: "T0*sqrt(C/(2*pi_sq*m1))"
    theta_t: "theta_max*cos(omega0*t)  (φ = 0: تُركت دون سرعة ابتدائية)"
    omega_first_pass: "-omega0*theta_max  (سالبة: انطلق من مطال موجب)"
    E: "0.5*C*theta_max**2"
  stem: "نواس فتل يتألف من {body_desc} معلّق من مركزه بسلك فتل شاقولي {given}. {question}"
  options:
    key: "المحسوب بوحدته"
    distractors:
      - {rule: mix_pendulums, rationale: "استعمل m·r² للقرص أو ⅓ml² للساق من منتصفها"}
      - {rule: forget_square, rationale: "T0 بلا تربيع عند عزل C"}
      - {rule: unit_g_kg, rationale: "الكتلة بالغرام أو الطول بالسنتيمتر"}
      - {rule: sign_flip, rationale: "السرعة الزاوية عند المرور الأول موجبة"}
      - {rule: forget_pm, rationale: "φ ≠ 0 رغم الترك دون سرعة ابتدائية"}
  rubric:
    - {step: "IΔ للجملة (مجموع عزوم الأجزاء)", points: 5}
    - {step: "T0 = 2π√(IΔ/C) أو العلاقة المطلوبة", points: 5}
    - {step: "التعويض (π² = 10، وحدات SI)", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
    - {step: "عند التابع: φ = 0 «لأنه تُرك دون سرعة ابتدائية»", points: 3, anti_keys: ["φ = π/2"]}
  answer_basis: "L2 §٥ (IΔ: ساق ml²/12 · قرص mr²/2 · نقطية mr²) · مثالا الكتاب ص ٢٧"
  review_notes:
    - "الأعداد في بنك المصدر مشوّشة كثيراً في هذه العائلة (أسس 10⁻² و10⁻³ مبعثرة) ⇒ لا يُنقل أي رقم منها؛ القيم أعلاه مختارة لتعطي نتائج نظيفة مع π² = 10."
    - "idx 90–91 (ميقاتية قرص + كتلتان + ساق): بنية مركّبة تحتاج الشكل ⇒ تُعرض على الأستاذ."
  approved: false

