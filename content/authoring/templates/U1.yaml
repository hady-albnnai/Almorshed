    - {n: 2, text: "−m·g·d·sin θ = IΔ·θ″ ⇒ θ″ + (mgd/IΔ)·sin θ = 0", points: 4}
    - {n: 3, text: "لا تقبل حلاً جيبياً لوجود sin θ ⇒ الحركة غير توافقية", points: 3}
    - {n: 4, text: "في السعات الصغيرة sin θ ≈ θ (rad) ⇒ θ″ + (mgd/IΔ)·θ = 0", points: 3}
    - {n: 5, text: "تقبل θ = θmax·cos(ω0t + φ)؛ نشتق مرتين ⇒ θ″ = −ω0²·θ", points: 4}
    - {n: 6, text: "بالمطابقة ω0² = mgd/IΔ ⇒ جيبية دورانية في السعات الصغيرة فقط", points: 3}
    - {n: 7, text: "T0 = 2π·√(IΔ/(m·g·d))", points: 3}
