- id: U1.PROOF.COMPOUND
  title: "برهان: النواس الثقلي المركّب جيبي دوراني في السعات الصغيرة فقط + T0 + دلالات الرموز"
  chapter: U1C3
  type: proof
  difficulty: 3
  weight: 25
  source: {lesson: "L3 🧮", book: "ص ٣١–٣٢"}
  steps:
