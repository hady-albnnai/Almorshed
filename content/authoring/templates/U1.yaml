- id: U1.L2.T06
  title: "نسب الدور عند تغيير طول السلك أو قطره أو عزم العطالة (C ∝ r⁴/l)"
  chapter: U1C2
  type: mcq
  difficulty: 2
  weight: 10
  source: {bank_idx: [20, 39, 42, 46, 49, 50, 51, 61, 63, 64, 65, 68, 69, 70, 71, 72, 73, 74, 78, 83, 99], book: "ص ٢٥، ٢٨", lesson: "L2 §٤ [أستاذ] قاعدة النسبة", exam: "٢٠٢٦ س١-١ (ربع الطول ⇒ نصف الدور) ✅"}
  vars:
    mode: {set: [length, diameter, inertia, amplitude, split_wire, cut_fraction, two_wires_C, two_wires_L, target_T]}
    fl: {set: [0.25, 0.5, 0.75, 0.8, 2, 4, 5], desc: "l′/l"}
    fd: {set: [0.5, 2], desc: "القطر الجديد/القديم"}
    fI: {set: [2, 4], desc: "IΔ′/IΔ"}
    T0: {set: [2, 4], unit: s}
  compute:
    r_length: "sqrt(fl)"
    r_diameter: "1/fd**2"
    r_inertia: "sqrt(fI)"
    r_amplitude: "1"
    r_split_wire: "0.5"
    r_cut_quarter: "sqrt(0.75)"
    two_wires_C: "C1 = fC*C2 ⇒ T01/T02 = 1/sqrt(fC)"
    two_wires_L: "T01/T02 = sqrt(L1/L2)"
    target_T: "l′/l = (T0′/T0)**2"
  stems:
    length: "نواس فتل دوره T0؛ نجعل طول سلك الفتل {fl} ما كان عليه. دوره الجديد:"
    diameter: "نواس فتل دوره T0؛ نجعل قطر السلك {fd} ما كان عليه (الطول نفسه). دوره الجديد:"
    inertia: "نواس فتل دوره T0؛ نزيد عزم عطالته إلى {fI} أمثال ما كان. دوره الجديد:"
    amplitude: "نواس فتل دوره {T0} s وسعته الزاوية 10°؛ نزيد سعته إلى 15°. دوره:"
    split_wire: "نقسم سلك الفتل إلى قسمين متساويين ثم نعلّق الساق من منتصفها بنصفَي السلك معاً (أعلى وأسفل). دوره الجديد:"
    cut_fraction: "نواس فتل دوره T0؛ ننقص من طول سلكه بمقدار الثلث/الربع. دوره الجديد:"
    two_wires_C: "ساقان متماثلتان معلّقتان بسلكَي فتل لهما الطول نفسه، C1 و C2 مع T01 = 2·T02. العلاقة بين الثابتين:"
    two_wires_L: "ساقان متماثلتان بسلكَي فتل متماثلين (المادة والقطر) طولاهما L1 وL2، وT01 = 2·T02. العلاقة بين الطولين:"
    target_T: "نواس فتل دوره {T0} s؛ نغيّر طول السلك فقط ليصبح دوره {T0/2} s. طول السلك الجديد:"
  options:
    key: "المحسوب (مثلاً length مع fl = 0.25 ⇒ T0/2 · diameter مع fd = 2 ⇒ T0/4 · two_wires_C ⇒ C2 = 4C1 · two_wires_L ⇒ L1 = 4L2 · split_wire ⇒ T0/2 · target_T ⇒ l/4)"
    distractors:
      - {rule: forget_sqrt, rationale: "T0 ∝ l بدل √l (ربع الطول ⇒ ربع الدور)"}
      - {rule: invert_ratio, rationale: "طول أقصر ⇒ دور أطول"}
      - {rule: exponent4, rationale: "القطر: نسي الأس ٤ (T0 ∝ 1/d بدل 1/d²)"}
      - {rule: amplitude_dependence, rationale: "السعة تغيّر الدور"}
  rubric:
    - {step: "C ∝ r⁴/l ⇒ T0 = 2π√(IΔ/C) ∝ √l / r²", points: 5}
    - {step: "النسبة T0′/T0", points: 3}
    - {step: "النتيجة", points: 2}
  answer_basis: "الكتاب ص ٢٥ · امتحان ٢٠٢٦ س١-١ (T0′ = T0/2 لربع الطول) ✅ مؤكَّد بالسلم"
  review_notes:
    - "cut_fraction: «ننقص بمقدار الثلث» ⇒ l′ = 2l/3 ⇒ T0′ = T0·√(2/3)؛ خيارات المصدر (√2، √3، …) مشوّشة ⇒ تُقرأ بصرياً قبل اعتماد أي منها."
  approved: false

