- id: U1.L3.T08
  title: "النواس البسيط: السرعة عند الشاقول/زاوية، التوتر، التسارع، السعة"
  chapter: U1C3
  type: problem
  difficulty: 3
  weight: 10
  source: {bank_idx: [43, 69, 70, 71, 76, 77, 79, 80, 85, 90, 108], book: "ص ٣٦، ٤٠ م٢", lesson: "L3 §٩ + مثال ٢"}
  vars:
    m:  {set: [0.1, 0.2, 0.4, 0.5], unit: kg}
    l:  {set: [0.2, 0.4, 1], unit: m}
    theta_max_deg: {set: [37, 60, 90], unit: "°"}
    theta_deg: {set: [0, 37, 60], unit: "°"}
    v0: {set: [2], unit: "m·s⁻¹", desc: "للسؤال العكسي عن θmax"}
    ask: {set: [v_bottom, v_theta, T_bottom, T_theta, theta_max_from_v0, a_n_bottom, a_t_theta]}
  constants_used: {g: 10, cos37: 0.8, cos60: 0.5, cos90: 0}
  constraints: ["theta_deg <= theta_max_deg"]
  compute:
    v_theta: "sqrt(2*g*l*(cos(theta) - cos(theta_max)))"
    v_bottom: "sqrt(2*g*l*(1 - cos(theta_max)))"
    T_theta: "m*g*(3*cos(theta) - 2*cos(theta_max))"
    T_bottom: "m*g*(3 - 2*cos(theta_max))"
    theta_max_from_v0: "acos(1 - v0**2/(2*g*l))"
    a_n_bottom: "v_bottom**2/l"
    a_t_theta: "g*sin(theta)"
  stem: "نواس ثقلي بسيط كتلة كرته {m} kg وطول خيطه {l} m، يُزاح عن الشاقول بزاوية {theta_max_deg}° ويُترك دون سرعة ابتدائية. احسب {ask} (g = 10 m·s⁻²)."
  options:
    key: "المحسوب بوحدته"
    distractors:
      - {value: "m*g", rule: forget_normal_accel, rationale: "التوتر = الثقل عند الشاقول"}
      - {value: "sqrt(g*l*(1 - cos(theta_max)))", rule: forget_half, rationale: "نسي 2 في 2gh"}
      - {value: "sqrt(2*g*l*(1 + cos(theta_max)))", rule: sign_flip, rationale: ""}
      - {value: "m*g*cos(theta)", rule: forget_normal_accel, rationale: "نسي mv²/l"}
      - {value: "omega0*theta_max*l", rule: forget_small_angle, rationale: "طبّق SHM على ٦٠°"}
  rubric:
    - {step: "نظرية الطاقة الحركية: ½mv² − 0 = W(w) + W(T)، W(T) = 0 «لأن T تعامد الانتقال»", points: 5}
    - {step: "h = l(cos θ − cos θmax) ⇒ v", points: 3}
    - {step: "التوتر: إسقاط w⃗ + T⃗ = ma⃗ على الناظم ⇒ T − mg·cos θ = m·v²/l", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "الكتاب ص ٣٦ · مثال الكتاب ص ٤٠ م٢ (m = 0.1 kg، l = 0.4 m، θmax = 60° ⇒ v0 = 2 m·s⁻¹، T = 2 N)"
  review_notes:
    - "idx 108 (دور بسيط طوله 40 cm بالسعة الكبيرة): يحتاج T = T0(1 + θmax²/16) وقيمة θmax غير مقروءة ⇒ مستبعد حتى قراءة النص."
  approved: false

- id: U1.L3.T09
  title: "المركّب من أجسام متجانسة: ساق من طرفها، قرص من محيطه، حلقة، مواقت"
  chapter: U1C3
  type: problem
  difficulty: 3
  weight: 10
  source: {bank_idx: [32, 53, 59, 68, 72, 75, 82, 86, 87, 88, 96, 97, 98, 99, 100, 101, 102, 103, 107, 109, 119, 120], book: "ص ٣٢، ٤٠ م١", lesson: "L3 §٤ + مثال ١"}
  vars:
    body: {set: [rod_end, rod_at_L6, disk_rim, disk_at_r2, ring_rim, rod_end_plus_mass]}
    L: {set: [0.5, 1, 1.5, 6], unit: m}
    r: {set: [0.02, 0.3, 0.6, "6/π²"], unit: m}
    M: {set: [0.5, 2, 3], unit: kg}
    m1: {set: [0.5], unit: kg}
    T0: {set: [2, 4], unit: s}
    theta_max: {set: [0.2, "π/3"], unit: rad}
    ask: {set: [T0, l_sync, omega_bottom, v_point, Ek_bottom, T0_formula]}
  constants_used: {g: 10, pi_sq: 10}
  table:
    rod_end:     {I: "M*L**2/3", d: "L/2", T0_formula: "T0 = 2π√(2L/(3g))"}
    rod_at_L6:   {I: "M*L**2/12 + M*(L/6)**2", d: "L/6", T0_formula: "T0 = 2π√(2L/(3g))"}
    disk_rim:    {I: "0.5*M*r**2 + M*r**2", d: "r", T0_formula: "T0 = 2π√(3r/(2g))"}
    disk_at_r2:  {I: "0.5*M*r**2 + M*(r/2)**2", d: "r/2", T0_formula: "T0 = 2π√(3r/(2g))"}
    ring_rim:    {I: "M*r**2 + M*r**2", d: "r", T0_formula: "T0 = 2π√(2r/g)"}
    rod_end_plus_mass: {I: "M*L**2/3 + m1*a**2", d: "(M*L/2 + m1*a)/(M + m1)", T0_formula: "T0 = 2π√(IΔ/((M+m1)·g·d))"}
  compute:
    T0_val: "2*sqrt(pi_sq*I/(Mtot*g*d))"
    l_sync: "I/(Mtot*d)"
    omega_bottom: "sqrt(2*Mtot*g*d*(1 - cos(theta_max))/I)"
    v_point: "omega_bottom*r_point"
    Ek_bottom: "Mtot*g*d*(1 - cos(theta_max))"
  stem: "نواس ثقلي مركّب من {body_desc} يهتز في مستوٍ شاقولي حول محور أفقي {axis_desc}. {question} (g = 10 m·s⁻²، π² = 10)"
  options:
    key: "المحسوب (مثلاً ساق L = 6 m من طرفها ⇒ T0 = 2π√(4/10) = 4 s · قرص r = 0.6 m من محيطه ⇒ T0 = 2π√0.09 = 0.6π ≈ 1.9 s · حلقة r = 2 cm ⇒ T0 = 2π√0.004 = 0.4 s)"
    distractors:
      - {value: "بـ IG بدل IΔ (نسي هايغنز)", rule: d_vs_I, rationale: "IΔ = IG + M·d²"}
      - {value: "بـ d = L بدل L/2", rule: d_vs_I, rationale: "مركز العطالة في المنتصف"}
      - {value: "2π√(L/g)", rule: mix_pendulums, rationale: "عامل الساق كنواس بسيط"}
      - {value: "بلا π (2√(…))", rule: forget_2pi, rationale: ""}
  rubric:
    - {step: "IΔ حول المحور (هايغنز عند الحاجة)", points: 5}
    - {step: "d = بعد المحور عن مركز عطالة الجملة", points: 3}
    - {step: "T0 = 2π√(IΔ/(m·g·d)) (يُقبل الشكل المختزل مثل 2π√(2L/3g))", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "الكتاب ص ٣٢ (هايغنز، d) · ص ٤٠ م١ (ساق 0.5 kg/1.5 m + نقطية 0.5 kg على 1 m ⇒ IΔ = 0.875، d = 0.875، T0 ≈ 2 s) · قاعدة السلم ٦: الحل البديل الصحيح مقبول"
  approved: false

- id: U1.L3.T10
  title: "المركّب: ساق مهملة الكتلة + كتل نقطية (نمط مسألة ٢٠٢٦ الأولى — ٨٥ درجة)"
  chapter: U1C3
  type: problem
  difficulty: 3
  weight: 85
  source: {bank_idx: [74, 91, 93, 94, 95, 104, 105, 106, 110, 111, 112, 113, 114, 115, 116, 117, 118], book: "ص ٤١ م٥", lesson: "L3 §٤ §٥ + مثال ٣", exam: "٢٠٢٦ المسألة الأولى ✅ (IΔ = (5/8)m1L² · d = L/4 · T0 = 2 s · θ′ = √10 rad·s⁻¹)"}
  vars:
    L: {set: [0.5, 0.8, 1, 1.5], unit: m}
    config: {set: [axis_at_L4_two_equal, axis_top_mass_top_and_bottom, axis_top_mass_mid_and_bottom, axis_top_single_mass_bottom]}
    m1: {set: [0.2, 0.3, 0.4, 0.5], unit: kg}
    m2: {set: [0.2, 0.4, 0.6], unit: kg}
    theta_max_deg: {set: [37, 60, 90], unit: "°"}
    ask: {set: [T0, L_from_T0, l_sync, omega_bottom, v_lower_mass, theta_t, T0_after_detach]}
  constants_used: {g: 10, pi_sq: 10}
  table:
    axis_at_L4_two_equal:
      desc: "ساق مهملة الكتلة طولها L تحمل في طرفيها كتلتين نقطيتين m1؛ المحور على بعد L/4 من الطرف العلوي"
      I: "m1*(L/4)**2 + m1*(3*L/4)**2 = (5/8)*m1*L**2"
      d: "(m1*(-L/4) + m1*(3*L/4))/(2*m1) = L/4"
      Mtot: "2*m1"
      T0_formula: "T0 = 2π√(5L/(4g)) = π√(5L/g)"
    axis_top_mass_top_and_bottom:
      desc: "ساق مهملة الكتلة طولها L، المحور في طرفها العلوي، كتلة m1 عند المحور وكتلة m2 في الطرف السفلي"
      I: "m2*L**2"
      d: "m2*L/(m1 + m2)"
      Mtot: "m1 + m2"
      T0_formula: "T0 = 2π√(L/g)"
    axis_top_mass_mid_and_bottom:
      desc: "ساق مهملة الكتلة طولها L، المحور في طرفها العلوي، كتلة m1 في منتصفها وكتلة m2 في طرفها السفلي"
      I: "m1*(L/2)**2 + m2*L**2"
      d: "(m1*L/2 + m2*L)/(m1 + m2)"
      Mtot: "m1 + m2"
      T0_formula: "T0 = 2π√(IΔ/((m1+m2)·g·d))"
    axis_top_single_mass_bottom:
      desc: "ساق مهملة الكتلة طولها L تحمل في نهايتها السفلية كتلة نقطية m1 (نواس بسيط طوله L)"
      I: "m1*L**2"
      d: "L"
      Mtot: "m1"
      T0_formula: "T0 = 2π√(L/g)"
  compute:
    T0_val: "2*sqrt(pi_sq*I/(Mtot*g*d))"
    L_from_T0: "حل T0_formula بالنسبة لـ L (config 1: L = g·T0²/(5π²) = T0²/5)"
    l_sync: "I/(Mtot*d)"
    omega_bottom: "sqrt(2*Mtot*g*d*(1 - cos(theta_max))/I)"
    v_lower_mass: "omega_bottom * r_lower"
    theta_t: "theta_max*cos(omega0*t)  (φ = 0 تُرك دون سرعة ابتدائية؛ صالح للسعات الصغيرة فقط)"
    T0_after_detach: "انفصال السفلية في config 1 ⇒ تبقى العلوية على بعد L/4 ⇒ T0′ = 2π√(L/(4g))"
  stem: "{table[config].desc}. {question} (g = 10 m·s⁻²، π² = 10)"
  options:
    key: "المحسوب (٢٠٢٦: L = 0.8 m ⇒ T0 = π√0.4 = 2 s · ℓ = 1 m · θ′ = √10 rad·s⁻¹ عند 60°)"
    distractors:
      - {value: "d = 3L/4 أو d = L/2", rule: d_vs_I, rationale: "استعمل بعد كتلة بدل مركز عطالة الجملة"}
      - {value: "d = (L/4 + 3L/4)/2 = L/2", rule: sign_r_above, rationale: "أهمل إشارة الكتلة فوق المحور"}
      - {value: "θ′ = ω0·θmax عند 60°", rule: forget_small_angle, rationale: "٦٠° ليست سعة صغيرة"}
      - {value: "m = m1 بدل 2m1 في mgd", rule: mix_pendulums, rationale: "كتلة الجملة كلها"}
  rubric:
    - {step: "IΔ = Σmi·ri² (كل الأبعاد موجبة)", points: 5}
    - {step: "d = Σmi·ri/Σmi مع ri جبرية (سالبة فوق المحور)", points: 5}
    - {step: "T0 = 2π√(IΔ/(m·g·d)) مع m = كتلة الجملة", points: 5}
    - {step: "الاختزال (يُقبل T0 = 2π√(5L/4g) — السلم ٢٠٢٦)", points: 3}
    - {step: "التعويض والنتيجة والوحدة", points: 5}
    - {step: "المواقت: 2π√(ℓ/g) = T0 ⇒ ℓ = IΔ/(m·d)", points: 5}
    - {step: "السرعة الزاوية: نظرية الطاقة الحركية، W(R) = 0 «لأن نقطة تأثيرها لا تنتقل»", points: 8}
    - {step: "θ′ = √(2mgd(1 − cos θmax)/IΔ) ⇒ النتيجة بوحدتها", points: 5}
  answer_basis: "امتحان ٢٠٢٦ المسألة الأولى وسلمها (docs/20 §٢) · الكتاب ص ٤١ م٥ · L3 §٥"
  review_notes:
    - "نص ورقة ٢٠٢٦ يذكر m1 وm2 والمحور على بعد d من الطرف العلوي؛ السلم يعطي IΔ = (5/8)m1L² وd = L/4 مما يوافق m1 = m2 ومحوراً عند L/4. يُثبَّت مع الأستاذ."
    - "في المصدر idx 92–95 و116–117 أعداد مشوّشة ⇒ لا تُنقل."
  approved: false

