        - {text: "−m·g·sin θ", rule: sin_cos, rationale: "المماسي"}
        - {text: "−m·g", rule: mix_pendulums, rationale: "فقط عند θ = 0"}
    - stem: "في النواس الثقلي البسيط مسقط قوة الثقل على المحور الناظمي عندما ينطبق الخيط على الشاقول هو:"
      key: "−W = −m·g"
      distractors:
        - {text: "+W", rule: sign_flip, rationale: ""}
        - {text: "−W·sin θ", rule: sin_cos, rationale: ""}
        - {text: "0", rule: mix_pendulums, rationale: ""}
    - stem: "مسقط قوة التوتر على المحور الناظمي الذي له حامل T⃗ وجهتها هو:"
      key: "+T"
      distractors:
        - {text: "−T", rule: sign_flip, rationale: ""}
        - {text: "T·cos θ", rule: mix_pendulums, rationale: ""}
        - {text: "T·sin θ", rule: mix_pendulums, rationale: ""}
    - stem: "يُعطى التسارع المماسي لكرة النواس الثقلي البسيط at بالعلاقة:"
      key: "جميع ما سبق صحيح (at = l·θ″ · at = r·α · at = −g·sin θ)"
      distractors:
        - {text: "at = l·θ″ فقط", rule: true_but_partial, rationale: ""}
        - {text: "at = v²/l", rule: mix_pendulums, rationale: "هذا الناظمي"}
        - {text: "at = 2π√(l/g)", rule: mix_pendulums, rationale: ""}
    - stem: "لحساب سرعة نواس ثقلي (بسيط أو مركّب) ننطلق من:"
      key: "نظرية الطاقة الحركية بين وضع الانطلاق (سكون) والوضع المطلوب"
      distractors:
        - {text: "العلاقة الأساسية في التحريك الدوراني", rule: mix_pendulums, rationale: "تعطي المعادلة التفاضلية لا السرعة"}
        - {text: "القانون الثاني بالإسقاط على الناظم", rule: mix_pendulums, rationale: "ذلك لحساب التوتر"}
        - {text: "θ′max = ω0·θmax دوماً", rule: forget_small_angle, rationale: "صحيح للسعات الصغيرة فقط"}
    - stem: "لحساب قوة توتر خيط النواس الثقلي البسيط ننطلق من:"
      key: "القانون الثاني w⃗ + T⃗ = m·a⃗ بالإسقاط على المحور الناظمي"
      distractors:
        - {text: "نظرية الطاقة الحركية", rule: mix_pendulums, rationale: "T لا تعمل"}
        - {text: "الإسقاط على المحور المماسي", rule: mix_pendulums, rationale: "T لا مسقط لها هناك"}
        - {text: "العلاقة الأساسية في التحريك الدوراني", rule: mix_pendulums, rationale: "عزم T صفر"}
    - stem: "عند إيجاد قوة التوتر يتم إسقاط العلاقة الشعاعية w⃗ + T⃗ = m·a⃗ على:"
      key: "المحور الناظمي الموجّه بجهة T⃗ (نحو المحور)"
      distractors:
        - {text: "المحور المماسي الموجّه بجهة الحركة", rule: mix_pendulums, rationale: ""}
        - {text: "المحور الشاقولي الموجّه نحو الأعلى", rule: mix_pendulums, rationale: ""}
        - {text: "المحور الناظمي الموجّه بعكس T⃗", rule: sign_flip, rationale: ""}
    - stem: "لحساب عزم عطالة جسم صلب بالنسبة لمحور لا يمر من مركز عطالته نستخدم نظرية هايغنز:"
      key: "IΔ = IG + m·d²"
      distractors:
        - {text: "IΔ = IG + m·d", rule: forget_square, rationale: ""}
        - {text: "IG = IΔ + m·d²", rule: invert_ratio, rationale: ""}
        - {text: "IΔ = IG − m·d²", rule: sign_flip, rationale: ""}
  rubric: [{step: "الاختيار الصحيح", points: 10}]
  answer_basis: "الكتاب ص ٣١–٣٦ · L3 §٣ §٧ §٩ · عبارات السلم: «حاملها يمر من المحور» (عزم) · «نقطة تأثيرها لا تنتقل» (عمل R) · «تعامد الانتقال» (عمل T)"
  approved: false

- id: U1.L3.T04
  title: "تمييز العلاقة الصحيحة (نواس ثقلي)"
  chapter: U1C3
  type: mcq
  difficulty: 1
  weight: 10
  source: {bank_idx: [5, 23, 42, 51, 54, 55, 58, 62, 63, 78, 83, 84], book: "ص ٣١–٣٧", lesson: "L3 الخلاصة"}
  vars:
    q: {set: [T0_compound, omega0_compound, h_simple, v_bottom, T_theta, T_bottom, W_weight, cos_from_h, omega_max_compound, T_max_where, sync, E_mech, d_def, l_simple_def]}
  table:
    T0_compound:  {stem: "دور النواس الثقلي المركّب من أجل السعات الصغيرة يُعطى بالعلاقة:", key: "T0 = 2π·√(IΔ/(m·g·d))"}
    omega0_compound: {stem: "النبض الخاص للنواس الثقلي المركّب يُعطى بالعلاقة:", key: "ω0 = √(m·g·d/IΔ)"}
    h_simple:     {stem: "المسافة الشاقولية h التي تقطعها كرة النواس البسيط من زاوية θ حتى ينطبق الخيط على الشاقول:", key: "h = l·(1 − cos θ)"}
    v_bottom:     {stem: "سرعة كرة النواس البسيط في وضع الشاقول (أُزيح θmax وتُرك) تُعطى بالعلاقة:", key: "v0 = √(2·g·l·(1 − cos θmax))"}
    T_theta:      {stem: "توتر خيط النواس البسيط عند الزاوية θ (أُزيح θmax وتُرك):", key: "T = m·g·(3·cos θ − 2·cos θmax)"}
    T_bottom:     {stem: "توتر خيط النواس البسيط عند المرور بالشاقول:", key: "T = m·g·(3 − 2·cos θmax)"}
    W_weight:     {stem: "عمل قوة الثقل لكرة النواس البسيط أثناء الهبوط من الطرف إلى الشاقول:", key: "W(w⃗) = +m·g·h"}
    cos_from_h:   {stem: "انطلاقاً من h = d(1 − cos θmax) للنواس المركّب في وضع التوازن الشاقولي فإن:", key: "cos θmax = 1 − h/d"}
    omega_max_compound: {stem: "تُعطى السرعة الزاوية العظمى للنواس الثقلي المركّب (سعة صغيرة) بالعلاقة:", key: "θ′max = ω0·θmax"}
    T_max_where:  {stem: "يكون توتر خيط النواس الثقلي البسيط أعظمياً:", key: "في وضع التوازن الشاقولي (θ = 0)"}
    sync:         {stem: "نواس ثقلي بسيط دوره T01 مواقت لنواس ثقلي مركّب دوره T02، عندئذ:", key: "T01 = T02"}
    E_mech:       {stem: "الطاقة الميكانيكية للنواس الثقلي البسيط غير المتخامد هي:", key: "جميع ما سبق صحيح (E = Ek + Ep · E = ½mv² + mgh · E = const)"}
    d_def:        {stem: "في النواس الثقلي المركّب غير المتخامد البعد بين محور الدوران ومركز العطالة هو:", key: "d (m)"}
    l_simple_def: {stem: "في النواس الثقلي البسيط البعد بين محور الدوران ومركز عطالة الكرة هو:", key: "l (وهو d نفسه في هذه الحالة)"}
  stem: "{table[q].stem}"
  options:
    key: "{table[q].key}"
    distractor_generation:
      - {rule: invert_ratio, rationale: "mgd/IΔ ↔ IΔ/mgd"}
      - {rule: forget_2pi, rationale: "2 بدل 2π"}
      - {rule: sin_cos, rationale: "sin بدل cos"}
      - {rule: sign_flip, rationale: "(cos θmax − cos θ) بدل (cos θ − cos θmax) · 3cos θmax − 2cos θ"}
      - {rule: forget_normal_accel, rationale: "T = mg عند الشاقول"}
      - {rule: mix_pendulums, rationale: "√(l/g) للمركّب"}
      - {rule: true_but_partial, rationale: "«جميع ما سبق»"}
  rubric: [{step: "الاختيار الصحيح", points: 10}]
  answer_basis: "الكتاب ص ٣١–٣٧ · L3 الخلاصة"
  review_notes:
    - "idx 83: الجذع مبتور في المصدر ⇒ مستبعد."
  approved: false

- id: U1.L3.T05
  title: "تبعية دور الثقلي (g، الكتلة، الطول) والميقاتية"
  chapter: U1C3
  type: mcq
  difficulty: 1
  weight: 10
  source: {bank_idx: [12, 20, 30, 31, 81], book: "ص ٣٢، ٣٤–٣٥، ٣٨–٣٩", lesson: "L3 §٨ §١٠"}
  variants:
    - stem: "يتناسب دور النواس الثقلي البسيط غير المتخامد:"
      key: "طرداً مع الجذر التربيعي لطول الخيط وعكساً مع الجذر التربيعي لتسارع الجاذبية"
      distractors:
        - {text: "طرداً مع طول الخيط", rule: forget_sqrt, rationale: ""}
        - {text: "طرداً مع كتلة الكرة", rule: mix_pendulums, rationale: "الكتلة تُختصر"}
        - {text: "طرداً مع نوع مادة الكرة", rule: mix_pendulums, rationale: ""}
    - stem: "ميقاتية ذات نواس ثقلي تدق الثانية على سطح البحر؛ ننقلها إلى قمة جبل فإنها:"
      key: "تؤخّر (تنقص g فيزداد الدور)"
      distractors:
        - {text: "تقدّم", rule: invert_ratio, rationale: ""}
        - {text: "تبقى تدق الثانية", rule: mix_pendulums, rationale: "خلط مع المرن/الفتل"}
        - {text: "تقف عن العمل", rule: mix_pendulums, rationale: ""}
    - stem: "ميقاتية تعتمد على نواس ثقلي بسيط تؤخّر في قمة ناطحة سحاب لأن:"
      key: "تنقص قيمة تسارع الجاذبية بالارتفاع فيزداد الدور"
      distractors:
        - {text: "تنقص قيمة الجاذبية فينقص الدور", rule: invert_ratio, rationale: ""}
        - {text: "تزداد قيمة الجاذبية فيزداد الدور", rule: invert_ratio, rationale: ""}
        - {text: "تزداد قيمة الجاذبية فينقص الدور", rule: invert_ratio, rationale: ""}
    - stem: "لتصحيح ميقاتية تقدّم في وقتها وتعتمد على نواس ثقلي مركّب (ساق وقرص):"
      key: "إيقاف الميقاتية وخفض القرص على الساق (تكبير الدور) ثم ضبط العقارب"
      distractors:
        - {text: "إيقاف الميقاتية ورفع القرص على الساق", rule: invert_ratio, rationale: "يصغّر الدور فتقدّم أكثر"}
        - {text: "تصحيح عقرب الدقائق فقط", rule: mix_pendulums, rationale: "الخلل يعود"}
        - {text: "إيقاف الميقاتية مدة ثم تشغيلها", rule: mix_pendulums, rationale: ""}
    - stem: "من أجل النواس الثقلي البسيط وعند انعدام الثقل الظاهري داخل المحطة الفضائية فإن دور النواس:"
      key: "لا نهائي (لا يهتز؛ g الظاهرية معدومة)"
      distractors:
        - {text: "معدوم", rule: invert_ratio, rationale: ""}
        - {text: "ثابت لا يتغير", rule: mix_pendulums, rationale: "خلط مع الفتل"}
        - {text: "نصف قيمته على الأرض", rule: mix_pendulums, rationale: ""}
  rubric: [{step: "الاختيار الصحيح مع التعليل", points: 10}]
  answer_basis: "T0 = 2π√(l/g) (الكتاب ص ٣٤) · ملاحظات الميقاتية [أستاذ] · ص ٣٨–٣٩"
  approved: false

