schema:
  template_fields:
    - id            # U1.L1.T01
    - chapter       # U1C1 | U1C2 | U1C3 (كما في pack.json)
    - type          # mcq | numeric | why | list | proof | problem
    - difficulty    # 1 مفهوم/تعريف · 2 خطوة حسابية واحدة · 3 متعدد الخطوات
    - weight        # درجة الامتحان المرجعية (MCQ = 10)
    - source        # bank_idx (من distractors.yaml) + book (صفحات) + exam
    - vars          # المتغيرات: set أو range + unit
    - constraints   # قيود بايثون تُقيَّم على القيم المسحوبة
    - compute       # تعابير بايثون: sqrt pi sin cos acos abs · الثوابت g pi_sq
    - stem          # الجذع؛ {var} يُستبدل
    - options       # key + distractors[{rule, value|text, rationale}]
    - variants      # للقوالب المفاهيمية بدل vars/compute: قائمة جذوع بمفاتيحها
    - rubric        # [{step, points, keys[], anti_keys[]}] بنمط السلم الوزاري
    - parts         # المسألة الكاملة (قرار ٦٨): [{label, ask, value|text, unit, answer{format,sig,round,unit_required},
                    #   compute{}, lines[{relation, subst, expect[], keys[], anti_keys[], unit_keys[], points{}, unit:false}],
                    #   distractors[{value|text, rule, rationale}], follow{depends_on, power, also[{power, note}]}}]
                    #   وزن الجزء = مجموع أسطره (٥ علاقة · ٣ تعويض · ١ نتيجة · ١ وحدة لكل سطر)، ووزن البند = مجموع أجزائه.
                    #   follow ⇒ «متابعة الخطأ»: القيمة المقبولة = scale × (جواب الطالب)^[power] — والمولّد يحسّب scale ويثبتها.
    - answer_basis  # القانون/الصفحة التي اشتُق منها المفتاح
    - review_notes  # التباسات صريحة للأستاذ
    - approved      # false دائماً هنا
  option_count: 4
  numeric_tolerance: 0.02          # ±٢٪ (docs/14 §ج)
  unit_required: true              # الوحدة درجة مستقلة (قاعدة السلم ٢)
  rubric_pattern_numeric: "العلاقة ٥ · التعويض ٣ · النتيجة ١ · الوحدة ١"
  distractor_rules:
    forget_sqrt:        "أهمل الجذر التربيعي (T0 ∝ m/k بدل √)"
    invert_ratio:       "قلب النسبة (خلط T0 مع ω0 أو m مع k)"
    forget_square:      "أهمل التربيع (T0² أو ω0² أو x²)"
    forget_2pi:         "أهمل 2π بين ω0 وT0"
    forget_4pi2:        "أهمل 4π² في k = 4π²m/T0²"
    forget_half:        "أهمل ½ في الطاقة"
    sign_flip:          "إشارة معكوسة (قوة/تسارع/سرعة/φ)"
    unit_cm_m:          "لم يحوّل cm ⇒ m"
    unit_g_kg:          "لم يحوّل g ⇒ kg"
    amplitude_dependence: "ظنّ الدور يتعلق بالسعة"
    mix_max_center:     "قلب الطرفين ↔ مركز الاهتزاز"
    mix_Ep_Ek:          "خلط الكامنة بالحركية"
    mix_v_a:            "خلط علاقة السرعة بالتسارع (ω0 ↔ ω0²)"
    sin_cos:            "خلط sin بـcos في التوابع الزمنية"
    forget_pm:          "أهمل ± في المطال أو السرعة"
    forget_n:           "أهمل الحل العام (+ nπ / + 2nπ) فحسب المرور الأول فقط"
    quarter_period_reflex: "افترض المرور الأول عند T0/4 مهما كان φ"
    mix_pendulums:      "خلط النواس المرن/الفتل مع الثقلي (أثر g أو الكتلة)"
    d_vs_I:             "استعمل بعد الكتلة في IΔ مكان d مركز العطالة"
    sign_r_above:       "أهمل إشارة r السالبة للكتلة فوق المحور"
    forget_small_angle: "طبّق θ′max = ω0θmax على سعة كبيرة"
    forget_normal_accel: "ظنّ التوتر عند الشاقول = الثقل"
    exponent4:          "تجاهل الأس ٤ في تبعية K لقطر السلك"
    scalar_vector:      "كتب 0 بدل 0⃗ للمحصلة"
    true_but_partial:   "خيار صحيح جزئياً حين يكون المفتاح «جميع ما سبق»"
    unit_confusion:     "واحدة مقدار آخر أو تركيب خاطئ للواحدات (أسئلة الوحدات)"
    off_by_one:         "خطأ بواحدة في عدّ الهزات (n±1)"
    mix_formulas:       "علاقة صحيحة لكنها لمقدار آخر من الدرس نفسه (أسئلة تمييز العلاقة)"

constants:
  g: 10          # m·s⁻²
  pi_sq: 10      # π² = 10
  pi_approx: 3.14

