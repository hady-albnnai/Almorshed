# ═══════════════════════════════════════════════════════════════════
# قوالب الأسئلة — الوحدة ١ (الحركة والتحريك) — المادة ٩ من المرحلة B
# الدروس هنا: L1 النواس المرن · L2 نواس الفتل · L3 النواس الثقلي
# (L4 السوائل · L5 النسبية ⇒ ملحق U1b لاحقاً — بنكاهما لم يدخلا distractors.yaml بعد)
#
# المدخلات:
#   - content/authoring/distractors.yaml (مادة ٨): ٤٠٢ سؤالاً بلا مفتاح.
#     الإحالة هنا بـ idx = الموضع الترتيبي (1-based) داخل lessons[id].items
#     (لأن الحقل n يتكرر في المصدر — الأقسام تبدأ العدّ من ١ كل مرة).
#   - content/authoring/U1/L1..L3 (الدروس المؤلَّفة من الكتاب + ملخص الأستاذ)
#   - content/authoring/exams/2026-1.md + docs/20 (قواعد السلم التسع)
#
# ⚠️ ضوابط دستورية:
#   ١) المصدر بلا مفتاح إجابات ⇒ «key» هنا مشتق من قانون الكتاب المذكور في
#      answer_basis (قانون ⇒ حساب)، لا من تخمين. كل ما التبس ⇒ review_notes
#      + إدراج في review_queue آخر الملف، ولا يدخل التوليد.
#   ٢) approved: false لكل قالب حتى مراجعة الأستاذ (لا أختام مسبقة).
#   ٣) الرموز كالكتاب: XmaX ω0 T0 φ x0 Fs0 k(ثابت صلابة النابض)
#      · θ θmax IΔ C(ثابت فتل السلك — الكتاب C، glossary K: سؤال للأستاذ) Γ_η/Δ (عزم مزدوجة الفتل) · d l g m.
#   ٤) الثوابت الامتحانية: g = 10 m·s⁻² · π² = 10 (كل قالب يستعملها يصرّح بها).
#   ٥) الإسناد: تم الإشراف على المادة العلمية من قبل الأستاذ القدير فداء مأمون البني.
# ═══════════════════════════════════════════════════════════════════

