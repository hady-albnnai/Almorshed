        - {text: "تزداد الطاقة الكامنة المرونية", rule: mix_Ep_Ek, rationale: "x يصغر"}
        - {text: "تتحول الطاقة الميكانيكية إلى حرارة", rule: mix_pendulums, rationale: "لا تخامد"}
    - stem: "في النواس المرن غير المتخامد وبازدياد القيمة المطلقة للمطال:"
      key: "تزداد الطاقة الكامنة المرونية وتنقص الحركية"
      distractors:
        - {text: "تنقص الطاقة الكامنة المرونية وتزداد الحركية", rule: mix_Ep_Ek, rationale: "Ep = ½kx²"}
        - {text: "تزداد الطاقتان معاً", rule: mix_Ep_Ek, rationale: "مجموعهما ثابت"}
        - {text: "تتحول الطاقة الكامنة إلى حركية", rule: mix_Ep_Ek, rationale: "العكس"}
    - stem: "تُمثَّل الطاقة الميكانيكية لنواس مرن غير متخامد بيانياً بدلالة مطاله:"
      key: "بخط مستقيم يوازي محور المطال"
      distractors:
        - {text: "بقطع مكافئ ذروته المبدأ O", rule: mix_Ep_Ek, rationale: "هذا تمثيل Ep = ½kx²"}
        - {text: "بخط مستقيم يمر ممدده من المبدأ", rule: mix_Ep_Ek, rationale: "E لا تتعلق بـx"}
        - {text: "بمنحنٍ جيبي متناوب", rule: sin_cos, rationale: "ذلك بدلالة الزمن لا المطال، وللمطال لا للطاقة"}
    - stem: "تُمثَّل الطاقة الكامنة المرونية لنواس مرن غير متخامد بيانياً بدلالة مطاله:"
      key: "بقطع مكافئ ذروته المبدأ O"
      distractors:
        - {text: "بخط مستقيم يوازي محور المطال", rule: mix_Ep_Ek, rationale: "هذا تمثيل E الكلية"}
        - {text: "بخط مستقيم يمر ممدده من المبدأ", rule: forget_square, rationale: "Ep ∝ x² لا x"}
        - {text: "بمنحنٍ جيبي متناوب", rule: sin_cos, rationale: "ليس تابعاً للزمن هنا"}
    - stem: "تكون الطاقة الحركية للنواس المرن غير المتخامد:"
      key: "معدومة في الموضعين الطرفيين وتساوي الطاقة الميكانيكية في مركز الاهتزاز"
      distractors:
