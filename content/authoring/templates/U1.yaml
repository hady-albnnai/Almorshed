- id: U1.L1.T17
  title: "الطور الابتدائي φ من شروط البدء"
  chapter: U1C1
  type: mcq
  difficulty: 2
  weight: 10
  source: {bank_idx: [65, 86, 105, 152, 159], book: "ص ١٢–١٣", lesson: "L1 §٦ (الشكل المختزل) ومثال ٣ (١) [أستاذ: نناقش الإشارة في تابع السرعة]"}
  vars:
    start: {set: [plus_XmaX, minus_XmaX, center_neg, center_pos, half_neg, half_pos, minus_half_neg]}
  table:
    plus_XmaX:     {desc: "في المطال الأعظمي الموجب (تُرك دون سرعة ابتدائية)", phi: "0"}
    minus_XmaX:    {desc: "في المطال الأعظمي السالب (تُرك دون سرعة ابتدائية)", phi: "π"}
    center_neg:    {desc: "في مركز الاهتزاز متحركاً بالاتجاه السالب", phi: "+π/2"}
    center_pos:    {desc: "في مركز الاهتزاز متحركاً بالاتجاه الموجب", phi: "−π/2"}
    half_neg:      {desc: "في x = +XmaX/2 متحركاً بالاتجاه السالب", phi: "+π/3"}
    half_pos:      {desc: "في x = +XmaX/2 متحركاً بالاتجاه الموجب", phi: "−π/3"}
    minus_half_neg: {desc: "في x = −XmaX/2 متحركاً بالاتجاه السالب", phi: "+2π/3"}
  stem: "نواس مرن غير متخامد كان جسمه في مبدأ الزمن t = 0 {table[start].desc}. الطور الابتدائي φ في x = XmaX·cos(ω0·t + φ):"
  options:
    key: "φ = {table[start].phi} rad"
    distractors:
      - {rule: sign_flip, rationale: "الإشارة المعاكسة — لم يناقش إشارة السرعة v = −ω0XmaX·sin φ"}
      - {rule: forget_pm, text: "φ = ±(القيمة)", rationale: "ترك ± دون حسم"}
      - {rule: mix_max_center, text: "π/2 مكان π أو 0 مكان π/2", rationale: "خلط الطرف بالمركز"}
  rubric:
    - {step: "t = 0 في تابع المطال ⇒ cos φ", points: 3}
    - {step: "t = 0 في تابع السرعة ⇒ إشارة sin φ من جهة الحركة", points: 3}
    - {step: "قيمة φ النهائية", points: 4}
  answer_basis: "شروط البدء (الكتاب ص ١٢–١٣) · مثال الكتاب ص ١٩ م٤"
  approved: false

- id: U1.L1.T18
  title: "لحظات المرور بالمركز/الطرف وقيم v وa في لحظة معلومة"
  chapter: U1C1
  type: numeric
  difficulty: 3
  weight: 10
  source: {bank_idx: [93, 103, 106, 107, 115, 117, 119, 122, 123, 125, 126, 130, 131, 134, 143, 144, 149, 154, 155, 156, 158, 169, 170, 171, 177], book: "ص ١٩ م٤", lesson: "L1 مثال ٣ (٢) + [أستاذ] أزمنة المرور = أعداد فردية من T0/4 عند φ = 0"}
  vars:
    omega0: {set: ["π", "2π", 2, 5, 10], unit: "rad·s⁻¹"}
    phi:    {set: ["0", "π/6", "π/3", "π/2", "π", "−π/3"], unit: rad}
    XmaX:   {set: [0.04, 0.06, 0.08, 0.1, 0.12], unit: m}
    mode:   {set: [t_center_first, t_center_second, t_center_third, t_plus_max_first, t_minus_max_first, v_at_center_first, v_at_t, a_at_t, which_pass, t_for_x_value]}
    tq:     {set: ["T0/4", "T0/2", "3T0/4", "5T0/4", "3T0/2", "5T0/12"]}
  compute:
    T0: "2*pi/omega0"
    t_center_n: "((pi/2 - phi) + n*pi)/omega0  for n = 0,1,2 with t ≥ 0"   # x = 0 ⇒ ω0t+φ = π/2 + nπ
    t_plus_max_n: "((0 - phi) + 2*n*pi)/omega0 with t ≥ 0"                # x = +XmaX ⇒ ω0t+φ = 2nπ
    t_minus_max_n: "((pi - phi) + 2*n*pi)/omega0 with t ≥ 0"              # x = −XmaX ⇒ ω0t+φ = (2n+1)π
    v_at_center_first: "-omega0*XmaX*sin(pi/2 + n0*pi)"                   # الإشارة سالبة إذا انطلق من مطال موجب
    v_at_t: "-omega0*XmaX*sin(omega0*t + phi)"
    a_at_t: "-omega0**2*XmaX*cos(omega0*t + phi)"
  stems:
    t_center_first: "تابع المطال x = {XmaX}·cos({omega0}·t + {phi}). لحظة المرور الأول بمركز الاهتزاز:"
    t_center_second: "تابع المطال x = {XmaX}·cos({omega0}·t + {phi}). لحظة المرور الثاني بمركز الاهتزاز:"
    t_plus_max_first: "تابع المطال x = {XmaX}·cos({omega0}·t + {phi}). أول لحظة يكون فيها المطال أعظمياً موجباً:"
    t_minus_max_first: "تابع المطال x = {XmaX}·cos({omega0}·t + {phi}). أول لحظة يكون فيها المطال أعظمياً سالباً:"
    v_at_center_first: "تابع المطال x = {XmaX}·cos({omega0}·t). سرعة الجسم لحظة المرور الأول بوضع التوازن:"
    v_at_t: "تابع السرعة v = −{vmax}·sin({omega0}·t + {phi}). قيمة السرعة في اللحظة t = {tq}:"
    a_at_t: "تابع التسارع a = −amax·cos({omega0}·t). قيمة التسارع في اللحظة t = {tq}:"
    which_pass: "لحظات المرور بوضع التوازن تُعطى بـ t = {t0} + n·T0/2. في اللحظة t = {t_given} يكون النواس في المرور:"
    t_for_x_value: "تابع المطال x = {XmaX}·cos({omega0}·t + {phi}). أول لحظة يكون فيها المطال x = {XmaX/2}:"
  options:
    key: "المحسوب من compute بحسب mode"
    distractors:
      - {rule: quarter_period_reflex, rationale: "T0/4 مهما كان φ"}
      - {rule: forget_n, rationale: "المرور الثاني = الأول + T0 بدل + T0/2"}
      - {rule: sign_flip, rationale: "سرعة المرور الأول موجبة مع أنه انطلق من مطال موجب"}
      - {rule: sin_cos, rationale: "عوّض في cos بدل sin"}
  rubric:
    - {step: "شرط الموضع (x = 0 ⇒ cos(…) = 0 ⇒ ω0t + φ = π/2 + nπ)", points: 5}
    - {step: "الحل العام ثم اختيار n المناسب", points: 3}
    - {step: "النتيجة بوحدتها (وإشارة السرعة عند طلبها)", points: 2}
  answer_basis: "الكتاب ص ١٩ م٤ · L1 مثال ٣ (٢)"
  review_notes:
    - "idx 90 (جذع مبتور «m.s 0.04 في موضع مطاله») مستبعد — انظر review_queue."
  approved: false

