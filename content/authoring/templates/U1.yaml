# ───────────────── المسألة الكاملة بأجزاء — قرار ٦٨ (parts-v1) ─────────────────
# هذا أول قالب «مسألة» حقيقي في المستودع: نص واحد، ثلاثة أجزاء متسلسلة على
# المعطيات نفسها، لكل جزء مفتاحه وسلّمه، ومتابعة خطأ محسوبة ومثبتة آلياً.
# البنية مأخوذة حرفياً من مسألة ٢٠٢٦ الأولى (docs/20 §٦): ١) استنتاج علاقة الدور
# ثم حسابه · ٢) الطول المكافئ · ٣) استنتاج السرعة الزاوية ثم حسابها — الرموز ✅
# مؤكدة في المصدر، والقيم العددية فيه ⚠️ مشوَّشة ⇒ المعطيات من عندنا بنمط الكتاب.

- id: U1.L3.P01
  title: "النواس الثقلي المركّب — مسألة بأجزاء (نمط مسألة ٢٠٢٦ الأولى)"
  chapter: U1C3
  type: problem
  difficulty: 3
  source:
    lesson: "L3 §٤ §٥ + مثال ٣"
    book: "ص ٤١ م٥ · ص ٢٨–٣٢"
    exam: "٢٠٢٦ المسألة الأولى (البنية ٣ أجزاء ✅ — docs/20 §٦) · سلمها: ٥/٣/١/١ لكل سطر"
  vars:
    L: {set: [0.8, 1.8, 3.2], unit: m}
    m: {set: [0.2, 0.4, 0.5], unit: kg}
    theta_deg: {set: [60, 90], unit: "°"}
  constants_used: {g: 10, pi_sq: 10}
  compute:
    d: "L/4"
    Id: "m*(L/4)**2 + m*(3*L/4)**2"          # = (5/8)·m·L² — كما في السلم
    Mt: "2*m"                                  # كتلة الجملة M = m1 + m2
    dc: "L/4"                                  # بعد مركز الكتلة عن المحور (الكتلتان متماثلتان)
    l34: "3*L/4"                               # بعد الكتلة السفلية عن المحور
    T0: "2*sqrt(pi_sq*Id/(Mt*g*dc))"           # g = 10، π² = 10 ⇒ T0 = √(5L)
    l_eq: "g*T0**2/(4*pi_sq)"                   # ℓ = IΔ/(M·d) = g(T0/2π)²
    one_m_cos: "0.5 if theta_deg == 60 else 1.0"
    w2: "2*Mt*g*dc*one_m_cos/Id"                # ω² = 2·M·g·d·(1 − cos θmax)/IΔ
    wrad: "sqrt(w2)"
  stem: "نواس ثقلي مركّب من ساق شاقولية مهملة الكتلة طولها {L} m، تحمل في طرفها العلوي كتلة نقطية m1 وفي طرفها السفلي كتلة نقطية m2 متماثلة معها (m1 = m2 = {m} kg)، وينطبق الجملة بمحور دوران أفقي يبعد d = L/4 عن الطرف العلوي. تُحرَّك الجملة في مستوٍ شاقولي بزاوية صغيرة، مع g = 10 m·s⁻² وπ² = 10."
  parts:
    - label: "١"
      ask: "استنتج بالرموز علاقة الدور الخاص T0 للنواس المركّب بدلالة IΔ وM وg وd، ثم احسب قيمته العددية."
      unit: "s"
      value: "T0"
      answer: {format: auto}
      lines:
        - relation: "IΔ = Σ mi·ri² = m·(L/4)² + m·(3L/4)² = (5/8)·m·L²"
          subst: "IΔ = {m}·({d})² + {m}·({l34})²"
          expect: ["{Id}", "{l34}"]
          keys: ["Σ mi·ri²", "5/8", "m·L²"]
          anti_keys: ["IΔ = m·L²", "Σ mi·ri"]
        - relation: "T0 = 2π·√(IΔ/(M·g·d)) حيث M = m1 + m2 = 2m"
          subst: "T0 = 2π·√({Id}/({Mt}·10·{dc}))"
          expect: ["{Id}", "{dc}"]
          keys: ["2π·√(IΔ", "M·g·d", "m·g·d"]
          anti_keys: ["2π·√(M·g·d/IΔ)", "π·√(IΔ/(M·g·d))"]
    - label: "٢"
      ask: "احسب طول النواس الثقلي البسيط الموافق (الموازي) لهذا النواس المركّب."
      unit: "m"
      value: "l_eq"
      answer: {format: auto}
      follow: {depends_on: "١", power: 2}       # ℓ = g(T0/2π)² = T0²/4 ⇒ متابعة صحيحة بدلالة دور الطالب
      lines:
        - relation: "التماثل مع النواس البسيط: T0 = 2π·√(ℓ/g) ⇒ ℓ = IΔ/(M·d) = g·(T0/2π)²"
          subst: "ℓ = {Id}/({Mt}·{dc})"
          expect: ["{Id}", "{dc}"]
          keys: ["IΔ/(M·d)", "g·(T0/2π)²", "T0²/4"]
          anti_keys: ["ℓ = L", "ℓ = IΔ/(M·g·d)", "Δφ = NBS"]
    - label: "٣"
      ask: "نُزيح النواس عن وضع توازنه الشاقولي بزاوية θmax = {theta_deg}° ثم نتركه دون سرعة ابتدائية. استنتج بالرموز علاقة السرعة الزاوية عند مرور وضع التوازن، ثم احسب قيمتها."
      unit: "rad·s⁻¹"
      text: "{w2:sqrt} rad·s⁻¹"
      value: "wrad"
      follow: {depends_on: "١", power: -1}      # ωmax = (2π/T0)·√(2(1−cos θmax)) ⇒ ∝ 1/T0
      lines:
        # سطر النظرية: علاقة + تعويض فقط (لا نتيجة ولا وحدة له — النتيجة للسطر التالي)
        - relation: "نظرية الطاقة الحركية بين θ1 = θmax وθ2 = 0: ½·IΔ·ω² = M·g·d·(1 − cos θmax)"
          subst: "ω² = 2·M·g·d·(1 − cos θmax)/IΔ"
          keys: ["½·IΔ·ω²", "نظرية الطاقة", "1 − cos"]
          anti_keys: ["½·IΔ·ω² = M·g·d·(1 + cos θmax)", "ω = ω0·θmax"]
          result: false
          unit: false
        - relation: "ω = √(2·M·g·d·(1 − cos θmax)/IΔ)"
          subst: "ω = √({w2})"
          expect: ["{w2}"]
          keys: ["√(2·M·g·d", "√(8/L", "√(16/L"]
  answer_basis: "الكتاب ص ٤١ م٥ (IΔ = Σ mi·ri² · d = Σ mi·ri/M · T0 = 2π√(IΔ/(M·g·d))) · سلم ٢٠٢٦: «T0 = 2π√(IΔ/mgd)» ٥ درجات · docs/20 §٢ قواعد ١ و٢ و٦"
  review_notes:
    - "وزن البند ٤٨ لا ٨٥: سطران كاملان في الجزء ١ (١٠+١٠) وسطر في الجزء ٢ (١٠) و(٨ + ١٠) في الجزء ٣؛ الفرق عن الوزارية خطوات وسيطة ورسم وتعليل — تُزاد أسطراً بقرار الأستاذ ولا تُخترع."
    - "القالب يفترض m1 = m2 وd = L/4 لأنه وحده ما يوافق IΔ = (5/8)m1L² في السلم؛ السؤال معلَّق أصلاً في review_queue (teacher_questions)."
    - "قيم ٢٠٢٦ العددية ⚠️ مشوَّشة في المصدر — لم تُنقل؛ المعطيات هنا من اختيارنا وتُعطي ℓ = 1 m وω = √10 عند L = 0.8 (مطابقة لما ورد في docs/14 وصفة L3)."
  approved: false

