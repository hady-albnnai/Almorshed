- id: U1.L1.T01
  title: "قوة الإرجاع — تناسبها واتجاهها، وتبعية الدور"
  chapter: U1C1
  type: mcq
  difficulty: 1
  weight: 10
  source: {bank_idx: [1, 2, 16, 29, 40, 66], book: "ص ١٠–١٢", lesson: "L1 §٣ §٥"}
  variants:
    - stem: "تتناسب شدة قوة الإرجاع في النواس المرن غير المتخامد:"
      key: "طرداً مع المطال وتعاكسه بالإشارة"
      distractors:
        - {text: "طرداً مع سعة الحركة", rule: amplitude_dependence, rationale: "السعة ثابتة؛ القوة تتغير لحظياً مع x"}
        - {text: "طرداً مع الجذر التربيعي لكتلة الجسم المهتز", rule: invert_ratio, rationale: "خلط مع علاقة الدور"}
        - {text: "عكساً مع الجذر التربيعي لثابت صلابة النابض", rule: invert_ratio, rationale: "خلط مع علاقة الدور"}
    - stem: "تتجه قوة الإرجاع في النواس المرن غير المتخامد دوماً:"
      key: "نحو مركز الاهتزاز"
      distractors:
        - {text: "نحو الموضعين الطرفيين", rule: mix_max_center, rationale: "F = −k·x تعاكس المطال فتتجه للمركز"}
        - {text: "بجهة شعاع السرعة", rule: mix_v_a, rationale: "القوة بجهة التسارع لا السرعة"}
        - {text: "بعكس جهة شعاع التسارع", rule: sign_flip, rationale: "F = m·a ⇒ الجهة نفسها"}
    - stem: "تزداد شدة قوة الإرجاع في النواس المرن بازدياد:"
      key: "مطاله x"
      distractors:
        - {text: "سرعته v", rule: mix_v_a, rationale: "حيث السرعة عظمى تنعدم القوة"}
        - {text: "سعة الحركة XmaX", rule: amplitude_dependence, rationale: "السعة ثابتة أثناء الحركة"}
        - {text: "دوره T0", rule: mix_pendulums, rationale: "الدور ثابت"}
    - stem: "يتناسب دور النواس المرن غير المتخامد:"
      key: "طرداً مع الجذر التربيعي لكتلة الجسم المهتز"
      distractors:
        - {text: "طرداً مع كتلة الجسم المهتز", rule: forget_sqrt, rationale: "T0 = 2π√(m/k)"}
        - {text: "طرداً مع الجذر التربيعي لثابت صلابة النابض", rule: invert_ratio, rationale: "k في المقام"}
        - {text: "عكساً مع الجذر التربيعي لكتلة الجسم المهتز", rule: invert_ratio, rationale: "m في البسط"}
  rubric: [{step: "الاختيار الصحيح", points: 10}]
  answer_basis: "F = −k·x (الكتاب ص ١١) · T0 = 2π√(m/k) (ص ١٢)"
  review_notes:
    - "idx 2 (طبيعة التسارع: ثابت/متغير في الحامل والجهة والشدة): الصواب فيزيائياً «ثابت الحامل، متغير الجهة والشدة» ولا خيار يطابقه حرفياً في المصدر ⇒ مُستبعد من التوليد حتى يُراجع نصّه الأصلي."
  approved: false

- id: U1.L1.T02
  title: "أين يكون المقدار أعظمياً وأين ينعدم"
  chapter: U1C1
  type: mcq
  difficulty: 1
  weight: 10
  source: {bank_idx: [9, 10, 18, 20, 48, 53, 64, 68, 88], book: "ص ١٣–١٤", lesson: "L1 §٦ جدول الأعظمي/المعدوم"}
  vars:
    q: {set: ["المطال", "السرعة", "التسارع", "قوة الإرجاع"]}
  table:
    المطال:        {max: "الموضعين الطرفيين", zero: "مركز الاهتزاز"}
    السرعة:        {max: "مركز الاهتزاز", zero: "الموضعين الطرفيين"}
    التسارع:       {max: "الموضعين الطرفيين", zero: "مركز الاهتزاز"}
    قوة الإرجاع:   {max: "الموضعين الطرفيين", zero: "مركز الاهتزاز"}
  stem: "في النواس المرن غير المتخامد يكون {q}:"
  options:
    key: "أعظمياً (طويلةً) في {table[q].max} ومعدوماً في {table[q].zero}"
    distractors:
      - {text: "أعظمياً في {table[q].zero} ومعدوماً في {table[q].max}", rule: mix_max_center, rationale: "قلب الموضعين"}
      - {text: "مقداراً ثابتاً لا يتغير أثناء الحركة", rule: mix_pendulums, rationale: "كل المقادير اللحظية تتغير مع x"}
      - {text: "أعظمياً ولا ينعدم مطلقاً", rule: mix_max_center, rationale: "كل مقدار لحظي ينعدم في موضع"}
  variants:
    - stem: "عند حركة نواس مرن غير متخامد وفي مركز الاهتزاز يكون:"
      key: "a = 0 · v = vmax · Ek = E · Ep = 0"
      distractors:
        - {text: "a = amax · v = 0 · Ep = E · Ek = 0", rule: mix_max_center, rationale: "هذا وصف الطرفين"}
        - {text: "a = 0 · v = 0 · Ek = Ep", rule: mix_v_a, rationale: "السرعة عظمى في المركز"}
        - {text: "a = 0 · E = 0 · Ek = 0 · v = 0", rule: mix_Ep_Ek, rationale: "E لا تنعدم أبداً"}
    - stem: "عند حركة نواس مرن غير متخامد وفي الموضعين الطرفيين يكون:"
      key: "a = amax · v = 0 · Ep = E · Ek = 0"
      distractors:
        - {text: "a = 0 · v = vmax · Ek = E · Ep = 0", rule: mix_max_center, rationale: "هذا وصف المركز"}
        - {text: "a = 0 · v = 0 · Ep = E", rule: mix_v_a, rationale: "السرعة صفر لا يعني التسارع صفر"}
        - {text: "a = amax · v = vmax · Ek = E", rule: mix_max_center, rationale: "لا يبلغان أقصاهما معاً"}
    - stem: "عندما يمر الجسم في مركز الاهتزاز فإن الهزازة التوافقية البسيطة:"
      key: "ينعدم تسارعها ولا يقف الجسم (سرعته عظمى)"
      distractors:
        - {text: "ينعدم التسارع ويقف الجسم", rule: mix_v_a, rationale: "الخطأ الشائع ١ في الدرس: القوة صفر لا السرعة"}
        - {text: "تنعدم السرعة ويقف الجسم", rule: mix_max_center, rationale: "ذلك في الطرفين"}
        - {text: "تنعدم السرعة والتسارع ويقف الجسم", rule: mix_v_a, rationale: "لا ينعدمان معاً أبداً"}
  rubric: [{step: "الاختيار الصحيح", points: 10}]
  answer_basis: "v = −ω0·XmaX·sin(ω0t+φ) · a = −ω0²·x · F = −k·x (الكتاب ص ١٣–١٤)"
  approved: false

- id: U1.L1.T03
  title: "الطاقة: مواضعها وتحوّلاتها وتمثيلها البياني"
  chapter: U1C1
  type: mcq
  difficulty: 1
  weight: 10
  source: {bank_idx: [8, 11, 35, 37, 39, 42, 54, 55, 56, 57, 63, 109, 137, 138], book: "ص ١٥–١٦", lesson: "L1 §٧"}
  variants:
    - stem: "في مركز الاهتزاز تكون الطاقة الميكانيكية للنواس المرن غير المتخامد مساوية:"
      key: "للطاقة الحركية العظمى"
      distractors:
        - {text: "للطاقة الكامنة المرونية العظمى", rule: mix_max_center, rationale: "Ep = 0 في المركز"}
        - {text: "معدومة", rule: mix_Ep_Ek, rationale: "E ثابتة لا تنعدم"}
        - {text: "لنصف الطاقة الحركية العظمى", rule: forget_half, rationale: "E = Ek,max كاملة"}
    - stem: "في الموضعين الطرفيين تكون الطاقة الميكانيكية (الكلية) مساوية:"
      key: "الطاقة الكامنة المرونية العظمى"
      distractors:
        - {text: "الطاقة الحركية", rule: mix_max_center, rationale: "Ek = 0 عند v = 0"}
        - {text: "مجموع الطاقتين الحركية والكامنة وكلتاهما غير معدومة", rule: mix_Ep_Ek, rationale: "الحركية معدومة هناك"}
        - {text: "معدومة", rule: mix_Ep_Ek, rationale: "E ثابتة"}
    - stem: "عندما تنعدم الطاقة الحركية لنواس مرن غير متخامد تكون طاقته الكامنة المرونية:"
      key: "عظمى"
      distractors:
        - {text: "معدومة", rule: mix_Ep_Ek, rationale: "مجموعهما ثابت"}
        - {text: "ثابتة لا تتغير", rule: mix_pendulums, rationale: "Ep تتغير مع x²"}
        - {text: "تتناقص حتى تنعدم", rule: mix_max_center, rationale: "عندئذ تكون في ذروتها"}
    - stem: "عندما تنعدم الطاقة الكامنة المرونية لنواس مرن غير متخامد تكون طاقته الحركية:"
      key: "عظمى"
      distractors:
        - {text: "معدومة", rule: mix_Ep_Ek, rationale: "E = Ek عندئذ"}
        - {text: "ثابتة لا تتغير", rule: mix_pendulums, rationale: "Ek تتغير مع v²"}
        - {text: "تتناقص حتى تنعدم", rule: mix_max_center, rationale: "العكس"}
    - stem: "عندما يتحرك الجسم من نقطة مطالها x = +XmaX/2 إلى مركز الاهتزاز فإن:"
      key: "الطاقة الكامنة المرونية تتناقص والحركية تزداد والميكانيكية ثابتة"
      distractors:
        - {text: "الطاقة الحركية تتناقص والكامنة تزداد", rule: mix_Ep_Ek, rationale: "المطال يصغر ⇒ Ep تصغر"}
        - {text: "الطاقة الميكانيكية تتناقص", rule: mix_Ep_Ek, rationale: "لا تخامد ⇒ E ثابتة"}
        - {text: "الطاقة الميكانيكية تزداد", rule: mix_Ep_Ek, rationale: "E ثابتة"}
    - stem: "بالاقتراب من مركز الاهتزاز في الهزازة التوافقية البسيطة وبإهمال القوى المبددة للطاقة:"
      key: "تتحول الطاقة الكامنة المرونية إلى طاقة حركية"
      distractors:
