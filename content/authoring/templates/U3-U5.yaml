# ───────────────────────────── U4 L3 — الكهرضوئي والأشعة السينية (U4C3) ─────────────────────────────

- id: U4.L3.T01
  title: "معادلة أينشتاين — الطاقة الحركية العظمى / كمون الإيقاف (بالـeV)"
  chapter: U4C3
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ٢٣٤–٢٣٨", lesson: "U4/L3 البرهان hf = Ws + ½mv²max [أستاذ س٣]"}
  vars:
    E_ph: {set: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 6.0]}
    Ws: {set: [1.5, 2.0, 2.3, 3.0, 4.0]}
    ask: {set: ["Ek", "U0"]}
  constraints:
    - "E_ph > Ws + 0.4"
  compute:
    key: "E_ph - Ws"
    qtxt: "'الطاقة الحركية العظمى للإلكترونات المنتزعة (بالـeV)' if ask == 'Ek' else 'كمون الإيقاف U0 (بالفولت)'"
    unit: "'eV' if ask == 'Ek' else 'V'"
  stem: "يسقط ضوء طاقة فوتونه {E_ph} eV على سطح معدن طاقة انتزاعه Ws = {Ws} eV. احسب {qtxt}."
  answer: {unit: "{unit}"}
  options:
    distractors:
      - {value: "E_ph", rule: forget_work_function, rationale: "أهمل Ws"}
      - {value: "E_ph + Ws", rule: sign_flip, rationale: "جمع بدل الطرح"}
      - {value: "(E_ph - Ws) * 1.6", rule: ev_joule, rationale: "خلط بتحويل eV/J"}
  rubric:
    - {step: "hf = Ws + Ek_max و e·U0 = Ek_max", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "hf = Ws + ½me·v²max (الكتاب ص ٢٣٦)"
  approved: false

- id: U4.L3.T02
  title: "أنبوب كوليدج — أصغر طول موجة للأشعة السينية"
  chapter: U4C3
  type: numeric
  difficulty: 3
  weight: 10
  source: {book: "ص ٢٤٢–٢٤٣", lesson: "U4/L3 البرهان λmin = hc/(eUAC) [أستاذ]"}
  vars:
    U_kV: {set: [10, 20, 25, 40, 50, 100]}
  compute:
    key: "h_planck * c_light / (e_charge * U_kV * 1e3)"
  stem: "يعمل أنبوب كوليدج بتوتر UAC = {U_kV} kV (h = 6.63×10⁻³⁴ J·s، c = 3×10⁸ m·s⁻¹، e = 1.6×10⁻¹⁹ C). احسب أصغر طول موجة للأشعة السينية الصادرة."
  answer: {unit: "m", format: sci, sig: 3, round: true}
  options:
    distractors:
      - {value: "h_planck * c_light / (e_charge * U_kV)", rule: unit_confusion, rationale: "لم يحوّل kV ⇒ V"}
      - {value: "e_charge * U_kV * 1e3 / (h_planck * c_light)", rule: invert_ratio, rationale: "قلب النسبة"}
      - {value: "h_planck / (e_charge * U_kV * 1e3)", rule: mix_formulas, rationale: "أهمل c (حسب 1/f بدل λ)"}
  rubric:
    - {step: "e·UAC = h·fmax = h·c/λmin", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة m", points: 1}
  answer_basis: "λmin = h·c/(e·UAC) (الكتاب ص ٢٤٣)"
  approved: false

