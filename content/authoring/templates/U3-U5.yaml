schema:
  distractor_rules:
    spindle_is_lambda:   "ظنّ طول المغزل = λ (هو λ/2)"
    open_closed_swap:    "خلط قانون المزمار المفتوح nv/2L بالمغلق (2n−1)v/4L"
    even_harmonic_closed: "أعطى المدروج الثاني 2f1 لمزمار مختلف الطرفين (المسموح 3f1)"
    forget_sqrt_T:       "أهمل الجذر في v ∝ √T أو v ∝ √FT"
    celsius_kelvin:      "استعمل درجة مئوية بدل الكلفن"
    energy_sign_bohr:    "خطأ إشارة/اتجاه: ظنّ الطاقة تقل بالابتعاد عن النواة"
    level_difference:    "أخذ طاقة السوية لا فرق السويتين"
    n_not_squared:       "13.6/n بدل 13.6/n²"
    intensity_vs_freq:   "ظنّ الشدة تحدد السرعة (بل التواتر)"
    forget_work_function: "أهمل Ws (Ek = hf)"
    ev_joule:            "لم يحوّل eV ⇒ J أو العكس"
    hubble_inverted:     "قلب v = H0·d"
    blue_red_swap:       "خلط الانزياح الأحمر (ابتعاد) بالأزرق (اقتراب)"
    escape_orbital_swap: "خلط سرعة الإفلات √(2GM/R) بالمدارية √(GM/R)"
    forget_2_escape:     "أهمل الـ٢ تحت الجذر في سرعة الإفلات"
    half_lambda:         "λ/4 بدل λ/2 أو العكس"

constants:
  g: 10
  pi_approx: 3.14
  h_planck: 0.000000000000000000000000000000000663
  e_charge: 0.00000000000000000016
  m_e: 0.00000000000000000000000000000091
  c_light: 300000000.0
  G_grav: 0.0000000000667

templates:

# ───────────────────────────── U3 L1 — الأوتار (U3C1) ─────────────────────────────

- id: U3.L1.T01
  title: "تجربة ملد — طول الموجة والسرعة من عدد المغازل"
  chapter: U3C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ١٧٤–١٧٨", lesson: "U3/L1 §٣ المسافات الذهبية + البرهان ٣ [أستاذ]"}
  vars:
    n: {set: [2, 3, 4, 5, 6]}
    L_cm: {set: [60, 80, 90, 100, 120, 150]}
    f: {set: [25, 50, 100]}
    ask: {set: ["lambda", "v"]}
  compute:
    lam: "2 * L_cm * 1e-2 / n"
    v: "lam * f"
    key: "lam if ask == 'lambda' else v"
    qtxt: "'طول الموجة λ' if ask == 'lambda' else 'سرعة انتشار الموجة على الوتر'"
    unit: "'m' if ask == 'lambda' else 'm·s⁻¹'"
  constraints:
    - "abs(lam * 100 - round(lam * 100)) < 1e-6"
  stem: "في تجربة ملد شكّل وتر طوله {L_cm} cm بين نهايتيه المقيدتين {n} مغازل عندما كان تواتر الهزازة {f} Hz. احسب {qtxt}."
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "L_cm * 1e-2 / n if ask == 'lambda' else L_cm * 1e-2 / n * f", rule: spindle_is_lambda, rationale: "عدّ المغزل طول موجة كاملة"}
      - {value: "2 * L_cm * 1e-2 * n if ask == 'lambda' else lam / f", rule: invert_ratio, rationale: "قلب النسبة"}
      - {value: "2 * L_cm / n if ask == 'lambda' else lam * f * 100", rule: unit_cm_m, rationale: "لم يحوّل cm ⇒ m"}
  rubric:
    - {step: "L = n·λ/2 ⇒ λ = 2L/n ثم v = λ·f", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "طول المغزل = λ/2 و v = λ·f (الكتاب ص ١٧٥)"
  approved: false

- id: U3.L1.T02
  title: "سرعة الموجة على وتر مشدود v = √(FT/μ) والتواتر الأساسي"
  chapter: U3C1
  type: numeric
  difficulty: 3
  weight: 10
  source: {book: "ص ١٧٨–١٧٩", lesson: "U3/L1 §٥ [أستاذ]"}
  vars:
    FT: {set: [10, 40, 90, 160, 250, 360]}
    mu_g_m: {set: [1, 4, 10, 25, 100]}
    L_cm: {set: [50, 60, 80, 100]}
    ask: {set: ["v", "f1"]}
  compute:
    mu: "mu_g_m * 1e-3"
    v: "sqrt(FT / mu)"
    f1: "v / (2 * L_cm * 1e-2)"
    key: "v if ask == 'v' else f1"
    qtxt: "'سرعة انتشار الأمواج العرضية على الوتر' if ask == 'v' else f'التواتر الأساسي لوتر طوله {L_cm} cm منه'"
    unit: "'m·s⁻¹' if ask == 'v' else 'Hz'"
  constraints:
    - "abs(v - round(v)) < 1e-9"
  stem: "وتر متجانس كتلته الخطية {mu_g_m} g·m⁻¹ مشدود بقوة شدها {FT} N. احسب {qtxt}."
  answer: {unit: "{unit}", format: auto}
  options:
    distractors:
      - {value: "FT / mu if ask == 'v' else FT / mu / (2 * L_cm * 1e-2)", rule: forget_sqrt_T, rationale: "أهمل الجذر"}
      - {value: "sqrt(mu / FT) if ask == 'v' else v / (L_cm * 1e-2)", rule: invert_ratio, rationale: "قلب النسبة / نسي الـ٢ في 2L"}
      - {value: "sqrt(FT / mu_g_m) if ask == 'v' else v / (2 * L_cm)", rule: unit_confusion, rationale: "ترك g·m⁻¹ أو cm"}
  rubric:
    - {step: "v = √(FT/μ) ثم f1 = v/2L", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة", points: 1}
  answer_basis: "v = √(FT/μ) · fn = n·v/(2L) (الكتاب ص ١٧٨)"
  approved: false

- id: U3.L1.T03
  title: "مفاهيم الأمواج المستقرة على الأوتار"
  chapter: U3C1
  type: mcq
  difficulty: 1
  weight: 10
  source: {book: "ص ١٧٠–١٨٠", lesson: "U3/L1 §٢–§٥"}
  variants:
    - stem: "المسافة بين عقدتين متتاليتين في موجة مستقرة تساوي:"
      key: "λ/2"
      distractors:
        - {text: "λ", rule: spindle_is_lambda}
        - {text: "λ/4", rule: half_lambda}
        - {text: "2λ", rule: mix_formulas}
    - stem: "المسافة بين عقدة والبطن الذي يليها مباشرة تساوي:"
      key: "λ/4"
      distractors:
        - {text: "λ/2", rule: half_lambda}
        - {text: "λ", rule: spindle_is_lambda}
        - {text: "3λ/4", rule: mix_formulas}
    - stem: "تنشأ الموجة المستقرة على الوتر نتيجة:"
      key: "تداخل الموجة الواردة مع المنعكسة المتساويتين تواتراً وسعة"
      distractors:
        - {text: "انتشار موجة واحدة بسرعة كبيرة", rule: mix_formulas}
        - {text: "تداخل موجتين مختلفتي التواتر", rule: mix_formulas}
        - {text: "امتصاص الموجة عند النهاية المقيدة", rule: mix_formulas}
    - stem: "بتواتر ثابت للهزازة، يزداد عدد المغازل على الوتر عندما:"
      key: "يزداد طول الوتر أو تنقص قوة الشد"
      distractors:
        - {text: "تزداد قوة الشد", rule: invert_ratio, rationale: "v↑ ⇒ λ↑ ⇒ n↓"}
        - {text: "ينقص طول الوتر", rule: invert_ratio}
        - {text: "تزداد سعة الهزازة", rule: mix_formulas}
    - stem: "إذا ضوعفت قوة شد الوتر أربع مرات فإن سرعة انتشار الموجة عليه:"
      key: "تتضاعف"
      distractors:
        - {text: "تصير أربعة أمثال", rule: forget_sqrt_T}
        - {text: "لا تتغير", rule: mix_formulas}
        - {text: "تنصّف", rule: invert_ratio}
    - stem: "الكتلة الخطية μ لوتر متجانس:"
      key: "لا تتغير بتغير طول الوتر"
      distractors:
        - {text: "تتناسب طرداً مع طوله", rule: mix_formulas}
        - {text: "تتناسب عكساً مع طوله", rule: mix_formulas}
        - {text: "تتعلق بقوة الشد", rule: mix_formulas}
  answer_basis: "الكتاب ص ١٧٤–١٧٨ [أستاذ ٢٩ ص ٢٧٩]"
  approved: false

# ───────────────────────────── U3 L2 — المزامير (U3C2) ─────────────────────────────

- id: U3.L2.T01
  title: "تواتر المزمار المفتوح/المغلق والمدروج التالي"
  chapter: U3C2
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ١٨٦–١٩٠", lesson: "U3/L2 البرهانان + جدول المقارنة [أستاذ]", exam: "س٣ اختبر نفسك"}
  vars:
    kind: {set: ["open", "closed"]}
    L_cm: {set: [17, 25, 34, 40, 50, 68, 85]}
    v: {set: [340]}
    ask: {set: ["f1", "next"]}
  compute:
    L: "L_cm * 1e-2"
    f1: "v / (2 * L) if kind == 'open' else v / (4 * L)"
    nxt: "2 * f1 if kind == 'open' else 3 * f1"
    key: "f1 if ask == 'f1' else nxt"
    ktxt: "'متشابه الطرفين (مفتوح)' if kind == 'open' else 'مختلف الطرفين (مغلق من أحد طرفيه)'"
    qtxt: "'تواتر الصوت الأساسي' if ask == 'f1' else 'تواتر المدروج التالي للأساسي'"
  constraints:
    - "abs(key - round(key)) < 1e-9"
  stem: "مزمار {ktxt} طوله {L_cm} cm، سرعة الصوت في الهواء {v} m·s⁻¹. احسب {qtxt}."
  answer: {unit: "Hz"}
  options:
    distractors:
      - {value: "(v / (4 * L) if kind == 'open' else v / (2 * L)) * (1 if ask == 'f1' else (3 if kind == 'open' else 2))", rule: open_closed_swap, rationale: "استعمل قانون النوع الآخر"}
      - {value: "2 * f1 if (ask == 'next' and kind == 'closed') else (3 * f1 if ask == 'next' else v / L)", rule: even_harmonic_closed, rationale: "2f1 للمختلف / أهمل الـ٢ أو ٤"}
      - {value: "f1 * 100 if ask == 'f1' else nxt / 100", rule: unit_cm_m, rationale: "ترك الطول بالسنتيمتر"}
  rubric:
    - {step: "المفتوح f = n·v/2L · المغلق f = (2n−1)·v/4L", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة Hz", points: 1}
  answer_basis: "الكتاب ص ١٨٨–١٨٩ — المدروج التالي للمختلف 3f1"
  approved: false

- id: U3.L2.T02
  title: "أثر درجة الحرارة في سرعة الصوت v ∝ √T"
  chapter: U3C2
  type: mcq
  difficulty: 2
  weight: 10
  source: {book: "ص ١٩٠", lesson: "U3/L2 §٥ [أستاذ ٣٤ ص ٢٨٠]"}
  vars:
    T1: {set: [273, 300]}
    ratio: {set: [4, 9]}
    v1: {set: [330, 340]}
  compute:
    r: "int(sqrt(ratio))"
    key: "v1 * r"
    d1: "v1 * ratio"
    d2: "v1 * (1 + (ratio - 1) / 2) if ratio == 4 else v1 * 2"
  stem: "سرعة الصوت في غاز عند درجة الحرارة المطلقة {T1} K تساوي {v1} m·s⁻¹. إذا ارتفعت درجة حرارته المطلقة إلى {ratio} أمثال قيمتها فإن سرعة الصوت فيه تصبح:"
  options:
    key: "{key} m·s⁻¹"
    distractors:
      - {text: "{d1} m·s⁻¹", rule: forget_sqrt_T, rationale: "ضرب بالنسبة بلا جذر"}
      - {text: "{v1} m·s⁻¹ (لا تتغير)", rule: mix_formulas, rationale: "ظنّ السرعة لا تتعلق بالحرارة"}
      - {text: "{d2} m·s⁻¹", rule: celsius_kelvin, rationale: "حساب غير جذري"}
  answer_basis: "v2/v1 = √(T2/T1) (الكتاب ص ١٩٠)"
  approved: false

- id: U3.L2.T03
  title: "مفاهيم المزامير — النهايات، الرنين، الأنواع"
  chapter: U3C2
  type: mcq
  difficulty: 1
  weight: 10
  source: {book: "ص ١٨٤–١٩٢", lesson: "U3/L2 §١–§٤ اختبر نفسك س١–س٦"}
  variants:
    - stem: "عند النهاية المغلقة لمزمار تتشكل:"
      key: "عقدة اهتزاز وبطن ضغط"
      distractors:
        - {text: "بطن اهتزاز وبطن ضغط", rule: mix_formulas}
        - {text: "عقدة اهتزاز وعقدة ضغط", rule: mix_formulas}
        - {text: "بطن اهتزاز وعقدة ضغط", rule: open_closed_swap, rationale: "هذه النهاية المفتوحة"}
    - stem: "مزمار ذو لسان نهايته مغلقة يُعدّ:"
      key: "متشابه الطرفين"
      distractors:
        - {text: "مختلف الطرفين", rule: open_closed_swap}
        - {text: "لا يصدر صوتاً", rule: mix_formulas}
        - {text: "يصدر المدروجات الفردية فقط", rule: open_closed_swap}
    - stem: "مزمار مختلف الطرفين تواتر صوته الأساسي 200 Hz؛ تواتر المدروج التالي:"
      key: "600 Hz"
      distractors:
        - {text: "400 Hz", rule: even_harmonic_closed}
        - {text: "300 Hz", rule: mix_formulas}
        - {text: "100 Hz", rule: invert_ratio}
    - stem: "في تجربة الرنين بالأنبوب والماء، المسافة بين موضعي صوتين شديدين متتاليين تمثل:"
      key: "λ/2"
      distractors:
        - {text: "λ/4", rule: half_lambda, rationale: "ذاك طول الرنين الأول"}
        - {text: "λ", rule: spindle_is_lambda}
        - {text: "3λ/4", rule: mix_formulas}
    - stem: "لمزمارين لهما الطول نفسه أحدهما مفتوح والآخر مغلق، يكون التواتر الأساسي للمغلق:"
      key: "نصف تواتر المفتوح"
      distractors:
        - {text: "ضعف تواتر المفتوح", rule: invert_ratio}
        - {text: "يساوي تواتر المفتوح", rule: open_closed_swap}
        - {text: "ربع تواتر المفتوح", rule: mix_formulas}
    - stem: "تُصنع جدران المزمار من الخشب أو المعدن السميك لكي:"
      key: "لا تشارك في الاهتزاز"
      distractors:
        - {text: "تزيد سرعة الصوت", rule: mix_formulas}
        - {text: "تضخّم الصوت بالاهتزاز معه", rule: mix_formulas}
        - {text: "تخفّض التواتر", rule: mix_formulas}
  answer_basis: "الكتاب ص ١٨٤–١٩٠ [أستاذ س١٢–س١٣]"
  approved: false

# ───────────────────────────── U4 L1 — ذرة بور (U4C1) ─────────────────────────────

- id: U4.L1.T01
  title: "سويات الهيدروجين — طاقة السوية وفوتون الانتقال"
  chapter: U4C1
  type: numeric
  difficulty: 2
  weight: 10
  source: {book: "ص ٢٠٠–٢٠٤", lesson: "U4/L1 §٤ En = −13.6/n² [أستاذ س٦]"}
  vars:
    n_hi: {set: [2, 3, 4, 5]}
    n_lo: {set: [1, 2, 3]}
    ask: {set: ["En", "dE"]}
  constraints:
    - "n_lo < n_hi"
  compute:
    En: "-13.6 / n_hi**2"
    dE: "13.6 * (1 / n_lo**2 - 1 / n_hi**2)"
    key: "En if ask == 'En' else dE"
    qtxt: "f'احسب طاقة السوية n = {n_hi}.' if ask == 'En' else f'احسب طاقة الفوتون الصادر عند انتقال الإلكترون من السوية n = {n_hi} إلى السوية n = {n_lo}.'"
  stem: "في ذرة الهيدروجين تُعطى طاقة السوية n بالعلاقة En = −13.6/n² (eV). {qtxt}"
  answer: {unit: "eV", sig: 3}
  options:
    distractors:
      - {value: "13.6 / n_hi if ask == 'En' else 13.6 * (1 / n_lo - 1 / n_hi)", rule: n_not_squared, rationale: "n بدل n²"}
      - {value: "13.6 / n_hi**2 if ask == 'En' else -dE", rule: energy_sign_bohr, rationale: "إشارة خاطئة"}
      - {value: "-13.6 / n_lo**2 if ask == 'En' else 13.6 / n_hi**2", rule: level_difference, rationale: "طاقة سوية بدل الفرق / سوية أخرى"}
  rubric:
    - {step: "En = −13.6/n² · hf = Ep − En", points: 5}
    - {step: "التعويض", points: 3}
    - {step: "النتيجة", points: 1}
    - {step: "الوحدة eV", points: 1}
  answer_basis: "En = −13.6/n² eV (الكتاب ص ٢٠٢)"
  approved: false

- id: U4.L1.T02
  title: "مفاهيم نموذج بور والطيوف"
  chapter: U4C1
  type: mcq
  difficulty: 1
  weight: 10
  source: {book: "ص ١٩٦–٢٠٦", lesson: "U4/L1 اختبر نفسك س١–س٧"}
  variants:
    - stem: "يمتص إلكترون ذرة الهيدروجين طاقة عندما:"
      key: "يقفز من سوية دنيا إلى سوية عليا"
      distractors:
        - {text: "يهبط إلى سوية أقرب من النواة", rule: energy_sign_bohr}
        - {text: "يدور ضمن السوية نفسها", rule: mix_formulas, rationale: "مدار مستقر لا إشعاع"}
        - {text: "يسقط على النواة", rule: mix_formulas}
    - stem: "نصف قطر المدار المستقر rn في نموذج بور يتناسب مع:"
      key: "n²"
      distractors:
        - {text: "n", rule: n_not_squared}
        - {text: "1/n²", rule: invert_ratio}
        - {text: "1/n", rule: invert_ratio}
    - stem: "طيف الإصدار لمصباح غازي يكون:"
      key: "خطياً متقطعاً"
      distractors:
        - {text: "مستمراً", rule: mix_formulas}
        - {text: "عصابات فقط", rule: mix_formulas}
        - {text: "لا يعطي طيفاً", rule: mix_formulas}
    - stem: "أكبر طاقة فوتون يمكن أن تصدرها ذرة هيدروجين (من الطاقة الكلية السالبة إلى السوية الأساسية) تقارب:"
      key: "13.6 eV"
      distractors:
        - {text: "10.2 eV", rule: level_difference, rationale: "انتقال 2→1 فقط"}
        - {text: "3.4 eV", rule: level_difference}
        - {text: "لا نهائية", rule: mix_formulas}
    - stem: "كلما ابتعد الإلكترون عن النواة في ذرة الهيدروجين فإن طاقته الكلية:"
      key: "تزداد (تقل سلبية) ويقل مقدار طاقة الارتباط"
      distractors:
        - {text: "تقل لأنها تبتعد عن النواة", rule: energy_sign_bohr}
        - {text: "لا تتغير", rule: mix_formulas}
        - {text: "تصير موجبة فوراً", rule: mix_formulas}
    - stem: "الطاقة الكلية للإلكترون في ذرة الهيدروجين سالبة لأن:"
      key: "الكامنة السالبة أكبر مطلقاً من الحركية الموجبة (طاقة ارتباط)"
      distractors:
